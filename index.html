let voice=null;function pick(){const vs=speechSynthesis.getVoices();voice=vs.find(v=>/zh[-_]CN/i.test(v.lang))||vs.find(v=>/^zh/i.test(v.lang))||null;$('#nov').hidden=!!voice||!vs.length}

let RATE=.85;
function say(t){if(!('speechSynthesis' in window))return Promise.resolve();speechSynthesis.cancel();return new Promise(res=>{const u=new SpeechSynthesisUtterance(String(t).replace(/（\s*）/g,'').replace(/……/g,'，').replace(/[\/|]/g,'，').replace(/\n/g,' '));u.lang='zh-CN';if(voice)u.voice=voice;u.rate=RATE;u.onend=u.onerror=res;speechSynthesis.speak(u)})}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let token=0;async function sayAll(list,mark){const t=++token;for(const x of list){if(t!==token)return;if(mark)mark(x);await say(x.z||x);await sleep(350)}}

function route(){let h=decodeURIComponent(location.hash.slice(1));let m;
 if((m=h.match(/^L(.+)$/))&&byId[m[1]])return go('lessons',m[1]);

室借用。", "s": "我用了隔壁办公室的打印机。", "t": true, "e": "Máy in hỏng nên người nói phải sang phòng bên mượn dùng."}, {"a": "小刘和我是大学同学，毕业以后他去了上海，我留在北京，我们虽然很少见面，但是每个月都会打电话。", "s": "他们毕业后在同一个城市工作。", "t": false, "e": "Một người ở Thượng Hải, một người ở Bắc Kinh."}, {"a": "我最近迷上了摄影，每个周末都会带着相机去郊区拍照，已经拍了上千张，打算下个月办一个小展览。", "s": "我打算办摄影展览。", "t": true, "e": "Đoạn nói 打算下个月办一个小展览."}, {"a": "公司新来的同事小周非常安静，开会的时候很少说话，但是他的工作做得又快又好，大家都很喜欢他。", "s": "大家不喜欢小周。", "t": false, "e": "Đoạn nói 大家都很喜欢他."}, {"a": "今天的会议从九点开到十一点半，大家讨论了很久，最后决定下个月推出新产品。", "s": "会议只开了一个小时。", "t": false, "e": "Từ 9 giờ đến 11 rưỡi là hai tiếng rưỡi."}], "L2": [{"d": [["女", "王经理，这份报告我今天下班前交给您，可以吗？"], ["男", "明天上午开会要用，你晚上再检查一遍，明早八点前发给我就行。"]], "q": "报告最晚什么时候要发给男的？", "o": ["今天下班前", "明天早上八点前", "明天开会以后", "后天上午"], "k": 1, "e": "Nam nói 明早八点前发给我就行."}, {"d": [["男", "你周末有空吗？我们几个朋友想去打羽毛球。"], ["女", "这周末我要加班，下周六怎么样？"]], "q": "女的这周末要做什么？", "o": ["打羽毛球", "去旅游", "加班", "看电影"], "k": 2, "e": "Nữ nói 这周末我要加班."}, {"d": [["女", "你的电脑怎么了？看起来很慢。"], ["男", "用了五年了，我打算下个月换一台新的。"]], "q": "男的打算做什么？", "o": ["修一下电脑", "借同事的电脑", "继续用旧的", "换台新电脑"], "k": 3, "e": "Nam nói 打算下个月换一台新的."}, {"d": [["男", "这个周末的聚会你去不去？"], ["女", "我很想去，但是要先问问我老公有没有安排。"]], "q": "女的是什么意思？", "o": ["不想去", "要先问老公", "已经决定去", "没有时间"], "k": 1, "e": "Nữ nói phải hỏi chồng trước (要先问问我老公)."}, {"d": [["女", "你为什么学吉他？"], ["男", "因为我觉得弹吉他的时候心情特别放松，工作的压力也小了。"]], "q": "男的为什么喜欢弹吉他？", "o": ["可以放松心情", "可以赚钱", "想当歌手", "朋友都在学"], "k": 0, "e": "Nam nói 心情特别放松 (tâm trạng rất thư giãn)."}, {"d": [["男", "这家咖啡馆的环境不错，就是人太多了。"], ["女", "那我们换个地方吧，对面有一家安静一点儿的。"]], "q": "女的觉得应该怎么办？", "o": ["再等一会儿", "回公司喝", "去对面那家", "点外卖"], "k": 2, "e": "Nữ đề nghị đổi sang quán đối diện yên tĩnh hơn."}, {"d": [["女", "小张，你的简历我看过了，你以前做过销售吗？"], ["男", "没有，不过我大学的时候在一家公司实习过半年，学到了很多。"]], "q": "男的有什么经历？", "o": ["销售经验", "三年工作经验", "管理经验", "半年实习经历"], "k": 3, "e": "Nam nói đã thực tập nửa năm ở một công ty."}, {"d": [["男", "我的钥匙是不是落在你办公室了？"], ["女", "对，我看见放在桌子上了，你下班来拿吧。"]], "q": "男的钥匙在哪儿？", "o": ["在车里", "在他家里", "在会议室", "在女的办公室"], "k": 3, "e": "Nữ nói chìa khóa để trên bàn ở văn phòng cô ấy."}], "L3": [{"d": [["女", "听说你们部门下周要去上海出差？"], ["男", "对，一共去三个人，我和小林，还有新来的小马。"], ["女", "要去几天？"], ["男", "五天，周一走，周五回来。"]], "q": "他们出差多长时间？", "o": ["三天", "四天", "五天", "一个星期"], "k": 2, "e": "Nam nói 五天 (năm ngày)."}, {"d": [["男", "你最近怎么每天都那么早下班？"], ["女", "我报了一个游泳班，每天下班后要去练一个小时。"], ["男", "这么认真，是想减肥吗？"], ["女", "也不完全是，主要是医生说我的腰不太好，游泳对身体有好处。"]], "q": "女的游泳主要是为了什么？", "o": ["对身体好", "减肥", "参加比赛", "认识朋友"], "k": 0, "e": "Nữ nói chủ yếu vì bác sĩ bảo bơi tốt cho cơ thể."}, {"d": [["女", "你昨天的面试怎么样？"], ["男", "不太顺利，他们问了很多我没准备过的问题。"], ["女", "别难过，下次多准备一下就好了。"], ["男", "你说得对，我打算先去买几本相关的书看看。"]], "q": "男的接下来打算做什么？", "o": ["马上再面试", "买书来学习", "找朋友帮忙", "换一个工作"], "k": 1, "e": "Nam nói 先去买几本相关的书看看."}, {"d": [["男", "小云，下个月同学聚会，你来组织吧。"], ["女", "我不太会，而且工作也很忙。"], ["男", "你人缘好，大家都愿意听你的，我帮你一起做。"], ["女", "好吧，那你负责订饭店，我来通知大家。"]], "q": "男的要做什么？", "o": ["通知同学", "付饭钱", "买礼物", "订饭店"], "k": 3, "e": "Nữ nói 你负责订饭店 (anh phụ trách đặt nhà hàng)."}], "L3p": [{"txt": "我的同事老赵特别喜欢钓鱼。每个周末，天还没亮，他就骑车去河边，一坐就是一整天。有时候一条鱼也钓不到，他也不生气，还说钓鱼最重要的是享受安静的时间。我们开玩笑说，他不是去钓鱼，而是去睡觉。", "qs": [{"q": "老赵周末一般去哪儿？", "o": ["公园", "河边", "山上", "海边"], "k": 1, "e": "Đoạn nói 骑车去河边."}, {"q": "老赵觉得钓鱼最重要的是什么？", "o": ["钓到大鱼", "认识朋友", "享受安静", "锻炼身体"], "k": 2, "e": "Ông nói quan trọng nhất là tận hưởng khoảng thời gian yên tĩnh."}]}, {"txt": "小美刚进公司的时候，对什么都不熟悉，常常出错。同组的李姐每次都耐心地教她，下班后还帮她整理资料。三个月以后，小美已经能自己完成大部分工作了。为了表示感谢，她请李姐吃了一顿饭。", "qs": [{"q": "李姐是怎样帮助小美的？", "o": ["给她介绍客户", "替她做所有工作", "耐心地教她", "帮她换部门"], "k": 2, "e": "Đoạn nói 耐心地教她."}, {"q": "小美为什么请李姐吃饭？", "o": ["为了表示感谢", "因为过生日", "要离开公司", "升职了"], "k": 0, "e": "Đoạn nói 为了表示感谢."}]}, {"txt": "现在很多公司开始实行弹性上班，也就是说，员工可以在早上八点到十点之间到公司，然后工作八个小时再回家。这样做的好处是，大家可以避开最堵车的时间，也能更好地照顾家人。不过，有些需要团队合作的工作，还是要求大家在同一时间上班。", "qs": [{"q": "弹性上班是什么意思？", "o": ["每周只上四天", "在家里上班", "工作时间更长", "上班时间可以自己安排"], "k": 3, "e": "Nhân viên có thể tự chọn giờ đến công ty trong khoảng 8-10 giờ."}, {"q": "哪种工作还是要求同一时间上班？", "o": ["需要团队合作的", "需要开车的", "需要出差的", "需要用电脑的"], "k": 0, "e": "Đoạn nói công việc cần hợp tác nhóm vẫn yêu cầu cùng giờ."}]}], "R1": {"words": ["通知", "经验", "讨论", "一定", "重要", "参加"], "items": [{"s": "明天下午的会议非常（　），请大家不要迟到。", "k": 4, "e": "非常 + tính từ, 重要 hợp với yêu cầu không đến muộn."}, {"s": "老板刚才（　）我们，下个月公司要搬到新的办公楼。", "k": 0, "e": "通知 + người + nội dung: thông báo cho chúng tôi."}, {"s": "这份工作需要有三年以上的工作（　），你符合条件吗？", "k": 1, "e": "工作经验 là cụm cố định (kinh nghiệm làm việc)."}, {"s": "周六的篮球比赛，你要不要和我们一起（　）？", "k": 5, "e": "参加比赛 là cụm cố định (tham gia thi đấu)."}, {"s": "这个问题很复杂，我们开会（　）一下再做决定吧。", "k": 2, "e": "讨论一下 (thảo luận một chút) rồi mới quyết định."}]}, "R2": [{"p": ["我们先要了解客户真正需要什么", "要想把产品卖出去", "然后再决定怎么做广告"], "k": "BAC", "e": "B nêu mục tiêu, A là bước đầu (先), C tiếp theo (然后)."}, {"p": ["他每天最后一个离开办公室", "老板很欣赏他的认真", "所以今年他被提升为部门经理"], "k": "ABC", "e": "Hành động (A), đánh giá (B), 所以 kết quả (C)."}, {"p": ["不过我们都不在意", "但是比赛的结果输了", "昨天的足球比赛，大家踢得很努力"], "k": "CBA", "e": "Mở đầu (C), 但是 chuyển ý (B), 不过 (A) kết luận."}, {"p": ["所以她决定利用周末去学英语", "小雅想换一份国际公司的工作", "可是她的英语水平还不够"], "k": "BCA", "e": "Mong muốn (B), 可是 trở ngại (C), 所以 giải pháp (A)."}, {"p": ["他每次出门旅行前都要写一个详细的计划", "可是他觉得这样玩得更轻松", "别人都说他太认真了"], "k": "ACB", "e": "Thói quen (A), người khác nhận xét (C), 可是他觉得 phản hồi (B)."}], "R3": [{"txt": "小李在一家广告公司工作，常常加班到很晚。最近他发现，晚上吃得太多会影响睡眠，所以他开始在下午六点前吃完晚饭，睡眠果然好多了。", "q": "小李是怎么改善睡眠的？", "o": ["早点儿吃晚饭", "少喝咖啡", "换了工作", "早点儿下班"], "k": 0, "e": "Anh ấy ăn xong bữa tối trước 6 giờ chiều."}, {"txt": "周末我和朋友一起去参加了一个读书会。大家每个人带来一本自己喜欢的书，然后轮流介绍。我不但认识了新朋友，还知道了很多以前没听说过的好书。", "q": "读书会上大家做什么？", "o": ["比赛读书", "轮流介绍喜欢的书", "一起写文章", "互相买书"], "k": 1, "e": "Mọi người lần lượt giới thiệu cuốn sách mình thích."}, {"txt": "复印机又坏了，这个月已经是第三次了。办公室的小陈建议公司干脆买一台新的，可是经理说预算不够，让大家先想办法。", "q": "经理对买新复印机是什么态度？", "o": ["马上同意", "让小陈决定", "认为预算不够", "觉得没有必要"], "k": 2, "e": "Giám đốc nói 预算不够 (ngân sách không đủ)."}, {"txt": "有人说，工作和生活要分开，下班以后就不应该再回工作信息。但是我觉得，如果是紧急的事情，及时回复也是对同事的尊重。", "q": "“我”的看法是什么？", "o": ["下班后绝对不回信息", "工作信息都很紧急", "同事不应该发信息", "紧急时应该及时回复"], "k": 3, "e": "Người nói cho rằng việc khẩn cấp thì nên trả lời kịp thời."}, {"txt": "小区里有一个自行车俱乐部，成员有二十多人，年龄从二十岁到六十岁都有。他们每个月骑车去一个新地方，既锻炼了身体，又认识了不少朋友。", "q": "关于这个俱乐部，可以知道什么？", "o": ["只有年轻人", "每月去一个新地方", "需要花很多钱", "每天都骑车"], "k": 1, "e": "Đoạn nói 每个月骑车去一个新地方."}, {"txt": "我的朋友小云做事总是很着急，经常早上出门时忘了带东西。后来她在门口放了一张小纸条，上面写着手机、钥匙和钱包。从那以后，她再也没有忘过。", "q": "小纸条的作用是什么？", "o": ["提醒她带东西", "记电话号码", "写购物清单", "留言给家人"], "k": 0, "e": "Tờ giấy ghi các đồ cần mang để nhắc cô ấy."}, {"txt": "很多年轻人喜欢在网上找工作。但是专家提醒，网上的招聘信息有真有假，如果有人要求你先交钱才能上班，那一定是骗子，千万不要相信。", "q": "专家提醒年轻人什么？", "o": ["不要上网找工作", "假信息很少", "应该多交朋友", "要求先交钱的是骗子"], "k": 3, "e": "Chuyên gia nói ai bắt nộp tiền trước mới được làm thì chắc chắn là kẻ lừa đảo."}, {"txt": "为了让孩子们对科学感兴趣，学校在周五下午举办了一次实验活动。同学们用醋和小苏打做出了一座“小火山”，大家都兴奋地叫了起来。", "q": "同学们在活动中做了什么？", "o": ["画了一座山", "参观了火山", "做了一座小火山", "看了科学电影"], "k": 2, "e": "Đoạn nói học sinh 做出了一座“小火山”."}, {"txt": "我爱人喜欢唱歌，我喜欢听。每个周末晚上，她都会在客厅里唱几首，我就坐在沙发上当她的“观众”。虽然她唱得不是特别好，但是我觉得那是一周中最快乐的时间。", "q": "“我”什么时候最快乐？", "o": ["自己唱歌的时候", "听爱人唱歌的时候", "看电视的时候", "加班的时候"], "k": 1, "e": "Người nói thấy lúc nghe vợ/chồng hát là thời gian vui nhất tuần."}, {"txt": "虽然这家饭馆的位置有点儿远，但是很多同事还是愿意在中午开车过去，因为那里的鱼做得特别好，价格也不贵。可惜午饭时间只有一个小时，路上就要花掉二十分钟。", "q": "同事们为什么愿意去那家饭馆？", "o": ["鱼好吃价格便宜", "离公司很近", "老板是朋友", "午饭时间很长"], "k": 0, "e": "Vì cá ở đó nấu rất ngon, giá cũng không đắt."}], "W1": [{"w": ["经理", "让", "我", "参加", "会议"], "a": ["经理让我参加会议。"]}, {"w": ["比", "好多了", "这个", "那个", "办法"], "a": ["这个办法比那个好多了。"]}, {"w": ["摄影", "他", "很", "感兴趣", "对"], "a": ["他对摄影很感兴趣。"]}, {"w": ["老板", "小王", "批评了", "被", "一顿"], "a": ["小王被老板批评了一顿。"]}, {"w": ["你", "能", "帮", "我", "复印", "一下", "吗"], "a": ["你能帮我复印一下吗？"]}], "W2": [{"w": "加班", "hint": "Một người đàn ông ngồi trước máy tính trong văn phòng vào buổi tối, đồng nghiệp đã về hết.", "a": "他今天晚上要加班。"}, {"w": "为了", "hint": "Một cô gái đang chạy bộ buổi sáng để giảm cân.", "a": "为了减肥，她每天早上都去跑步。"}, {"w": "终于", "hint": "Hai người bạn cuối cùng cũng leo tới đỉnh núi, rất vui.", "a": "我们终于爬到了山顶。"}]}, {"id": 3, "title": "Đề 3", "topics": "Du lịch, giao thông, khách sạn, sân bay", "L1": [{"a": "我们的航班本来八点起飞，但是因为天气不好，推迟到了十点。大家只好在候机室里等着。", "s": "航班比原计划晚起飞了。", "t": true, "e": "Đoạn nghe nói chuyến bay bị hoãn từ tám giờ sang mười giờ, tức là cất cánh muộn hơn dự kiến."}, {"a": "这家酒店离地铁站很近，走路只要五分钟，而且房间很干净，就是价格有点儿贵。", "s": "这家酒店离地铁站很远。", "t": false, "e": "Đoạn nghe nói đi bộ chỉ năm phút là tới ga tàu điện ngầm, tức là rất gần."}, {"a": "我第一次坐高铁去上海，只用了四个小时就到了。以前坐火车要十几个小时，现在方便多了。", "s": "高铁比以前的火车快很多。", "t": true, "e": "Đi tàu cao tốc chỉ bốn giờ, trước đây đi tàu hỏa mất hơn mười giờ."}, {"a": "出国旅行以前，你一定要检查护照有没有过期。上次我就是忘了带护照，差点儿没能上飞机。", "s": "他上次没带护照，所以没上飞机。", "t": false, "e": "Người nói chỉ \"suýt\" không lên được máy bay (差点儿), chứ không phải đã không lên."}, {"a": "导游告诉我们，下午三点在大门口集合，不要迟到，大巴车不会等人。", "s": "游客要在下午三点集合。", "t": true, "e": "Hướng dẫn viên nói ba giờ chiều tập trung ở cổng lớn."}], "L2": [{"d": [["女", "师傅，去机场大概要多长时间？"], ["男", "现在是上班时间，路上堵车，可能要一个小时。"]], "q": "男的是什么意思？", "o": ["路上可能很堵", "不去机场", "马上就能到", "要换地铁"], "k": 0, "e": "Nam nói đang giờ đi làm, đường kẹt xe nên có thể mất một tiếng."}, {"d": [["男", "您好，我订了一个双人间，现在可以办入住吗？"], ["女", "不好意思，两点以后才能进房间，您可以先把行李放在前台。"]], "q": "女的希望男的做什么？", "o": ["先交押金", "把行李放在前台", "换一个房间", "去楼上等"], "k": 1, "e": "Nữ bảo nam có thể gửi hành lý ở quầy lễ tân trước."}, {"d": [["女", "这个周末我们去海边玩儿，怎么样？"], ["男", "好是好，但我听说周末下雨，要不改到下周？"]], "q": "男的担心什么？", "o": ["海边太远", "票太贵", "天气不好", "没有时间"], "k": 2, "e": "Nam nghe nói cuối tuần có mưa nên đề nghị dời sang tuần sau."}, {"d": [["男", "你的行李箱怎么这么重？"], ["女", "我带了很多礼物，要送给国外的朋友。"]], "q": "女的箱子为什么重？", "o": ["里面有很多书", "装了很多衣服", "放了电脑", "带了不少礼物"], "k": 3, "e": "Nữ nói đã mang nhiều quà để tặng bạn ở nước ngoài."}, {"d": [["女", "请问，这趟车到北京站吗？"], ["男", "不到，您得在前面那站换车。"]], "q": "女的应该怎么办？", "o": ["马上下车", "在前面一站换车", "买新票", "问司机"], "k": 1, "e": "Nam nói xe không tới ga Bắc Kinh, phải đổi xe ở trạm phía trước."}, {"d": [["男", "我的护照找不到了，怎么办？"], ["女", "别着急，你再看看包里，是不是放在外面的小口袋里了？"]], "q": "女的建议男的做什么？", "o": ["去警察局", "给家人打电话", "再找一找包", "重新办护照"], "k": 2, "e": "Nữ khuyên nam tìm lại trong túi, có thể để ở ngăn nhỏ bên ngoài."}, {"d": [["女", "这次去云南旅游，你觉得最大的收获是什么？"], ["男", "认识了不少新朋友，还吃到了很多好吃的。"]], "q": "男的觉得旅游最大的收获是什么？", "o": ["认识了新朋友", "买到便宜东西", "学会了游泳", "拍了很多照片"], "k": 0, "e": "Nam nói thu hoạch là quen được nhiều bạn mới."}, {"d": [["男", "服务员，我们的菜怎么还没上？"], ["女", "对不起，今天客人太多，再等十分钟可以吗？"]], "q": "女的为什么道歉？", "o": ["菜做错了", "价格涨了", "客人不多", "上菜比较慢"], "k": 3, "e": "Vì hôm nay đông khách nên món lên chậm, nữ xin lỗi."}], "L3": [{"d": [["男", "你订好去三亚的机票了吗？"], ["女", "订好了，下周五早上的，比平时便宜了三百多块。"], ["男", "这么便宜？是不是要转机？"], ["女", "不用，是直飞的，就是起飞时间比较早，六点半。"], ["男", "那我们得四点就起床了。"], ["女", "对，所以我打算今天晚上早点儿睡。"]], "q": "关于机票，可以知道什么？", "o": ["需要转机", "是晚上起飞的", "是直飞的", "比平时贵了三百"], "k": 2, "e": "Nữ nói \"不用，是直飞的\", tức là bay thẳng, không cần quá cảnh."}, {"d": [["女", "你们这次去北京住在哪儿？"], ["男", "我们订了一家离景点很近的宾馆，不过房间比较小。"], ["女", "那个地方吃饭方便吗？"], ["男", "很方便，门口就有很多饭馆，还有超市。"], ["女", "那就好，小一点儿也没关系。"], ["男", "是啊，我们白天都在外面玩儿，只是晚上回去睡觉。"]], "q": "男的对宾馆的看法是什么？", "o": ["位置好，房间小", "价格便宜", "离地铁很远", "房间很大"], "k": 0, "e": "Nam nói nhà nghỉ gần điểm tham quan nhưng phòng khá nhỏ."}, {"d": [["男", "小李，听说你上个月去西安了，怎么样？"], ["女", "太好了！我看了兵马俑，还爬了华山。"], ["男", "华山那么高，你累不累？"], ["女", "累极了，不过看到日出的时候，我觉得一切都值得。"], ["男", "下次你再去，叫上我吧。"], ["女", "没问题，不过你得先锻炼一下身体。"]], "q": "女的觉得爬山怎么样？", "o": ["一点儿也不累", "很没意思", "天气不好", "很累但是值得"], "k": 3, "e": "Nữ nói mệt lắm nhưng ngắm bình minh thì thấy mọi thứ đều đáng."}, {"d": [["女", "我们的车票是几点的？"], ["男", "下午两点四十的，现在才十二点半，来得太早了。"], ["女", "我怕路上堵车，所以提前出门。"], ["男", "那我们先去吃点儿东西吧。"], ["女", "好，车站二楼有一家面馆，听说不错。"]], "q": "他们接下来要做什么？", "o": ["去检票", "去吃东西", "买车票", "换座位"], "k": 1, "e": "Nam đề nghị đi ăn chút gì trước và nữ đồng ý."}], "L3p": [{"txt": "各位旅客请注意，由于大雾影响，飞往广州的航班暂时不能起飞。请大家不要离开候机楼，我们会尽快通知起飞时间。航空公司将为大家提供免费的饭菜和饮料，如果需要帮助，请到三号服务台。给您带来的不便，我们表示抱歉。", "qs": [{"q": "航班为什么不能起飞？", "o": ["飞机坏了", "大雾", "乘客太少", "下大雨"], "k": 1, "e": "Thông báo nói do sương mù nên chuyến bay tạm thời không cất cánh được."}, {"q": "航空公司会为旅客提供什么？", "o": ["免费机票", "免费住宿", "打折门票", "免费饭菜和饮料"], "k": 3, "e": "Đoạn văn nói hãng sẽ cung cấp đồ ăn và nước uống miễn phí."}]}, {"txt": "我很喜欢一个人旅行。有人觉得一个人会很无聊，其实不是这样。你可以自己决定去哪儿、住多久，不用考虑别人的想法。当然，一个人出门也有缺点，比如遇到问题时，只能自己想办法解决。所以出发前我总是认真地做好计划，还会把地址告诉家人。", "qs": [{"q": "他为什么喜欢一个人旅行？", "o": ["可以自己做决定", "费用更便宜", "遇到问题少", "朋友很多"], "k": 0, "e": "Anh ấy nói có thể tự quyết đi đâu, ở bao lâu, không cần nghĩ đến ý người khác."}, {"q": "出发前他会做什么？", "o": ["买保险", "学外语", "做好计划，告诉家人地址", "请朋友陪同"], "k": 2, "e": "Câu cuối nói anh ấy lập kế hoạch kỹ và báo địa chỉ cho gia đình."}]}, {"txt": "这座城市有一条很有名的老街，很多游客专门来这里买小吃、拍照片。老街上的房子已经有一百多年的历史了，虽然有些旧，但是很有特点。政府规定，这里不允许开汽车，所以走在街上很安静。如果你想看到最美的老街，最好在傍晚来，因为灯亮起来以后特别漂亮。", "qs": [{"q": "老街上为什么很安静？", "o": ["游客很少", "汽车不能进去", "晚上才开门", "街很短"], "k": 1, "e": "Chính quyền quy định ở đây không cho lái ô tô vào."}, {"q": "什么时候来老街最好？", "o": ["早上", "中午", "夏天", "傍晚"], "k": 3, "e": "Đoạn văn nói nên đến vào lúc chiều tối vì đèn sáng lên rất đẹp."}]}], "R1": {"words": ["堵车", "预订", "导游", "特别", "托运", "景色"], "items": [{"s": "我们提前一个月就（　）了机票，所以价格很便宜。", "k": 1, "e": "Đặt vé trước một tháng nên dùng 预订 (đặt trước)."}, {"s": "这么大的行李箱不能带上飞机，只能（　）。", "k": 4, "e": "Vali quá lớn không mang lên khoang được nên phải 托运 (ký gửi)."}, {"s": "山上的（　）太美了，我拍了几百张照片。", "k": 5, "e": "Chụp hàng trăm ảnh vì 景色 (phong cảnh) trên núi rất đẹp."}, {"s": "在这个城市，周末的时候经常（　），最好坐地铁。", "k": 0, "e": "Khuyên đi tàu điện ngầm vì cuối tuần thường 堵车 (kẹt xe)."}, {"s": "这次旅行的（　）讲得很有意思，我们学到了很多历史知识。", "k": 2, "e": "Người giảng giải cho đoàn du lịch là 导游 (hướng dẫn viên)."}]}, "R2": [{"p": ["可是我们到了车站才发现，车票上的时间看错了", "小王和朋友打算坐火车去海边玩儿", "结果只好改签了下午的车"], "k": "BAC", "e": "B nêu kế hoạch, A dùng 可是 chuyển ý nói bị nhầm giờ, C là kết quả (结果)."}, {"p": ["如果去晚了，可能就上不了飞机了", "坐飞机要办很多手续", "所以最好提前半个小时到机场"], "k": "BCA", "e": "B nêu thủ tục nhiều, C kết luận bằng 所以, A bổ sung hậu quả nếu đến muộn."}, {"p": ["家人看了以后，都想去那儿玩儿", "他把这些照片都发给了家人", "小张这次去日本旅行，拍了很多照片"], "k": "CBA", "e": "C chụp ảnh, B gửi \"những tấm ảnh này\" (这些照片), A là phản ứng của gia đình."}, {"p": ["我们住的宾馆在一座小山旁边", "早上一起床，就能听到小鸟的叫声", "那里的空气非常好"], "k": "ACB", "e": "A nêu vị trí, C dùng 那里 chỉ nơi đó, B nói tiếp cảnh buổi sáng."}, {"p": ["他们决定夏天再来", "这个地方冬天很冷", "因此很多游客觉得冬天不适合来旅游"], "k": "BCA", "e": "Cần dùng 因此 sau lý do: B nêu lý do trời lạnh, C 因此 kết quả, A quyết định tới mùa hè."}], "R3": [{"txt": "小李第一次出国，他很紧张，不知道怎么办理入住。后来，酒店的服务员很热情地帮助了他，还送了他一张城市地图。小李觉得很温暖。", "q": "★ 小李为什么觉得温暖？", "o": ["服务员热情帮助他", "酒店很便宜", "房间很大", "地图很贵"], "k": 0, "e": "Vì nhân viên khách sạn nhiệt tình giúp đỡ và tặng bản đồ."}, {"txt": "从下个月开始，这个城市的地铁将延长运营时间，晚上十二点以前都有车。这对经常加班的人来说，是个好消息。", "q": "★ 这个消息对谁最有帮助？", "o": ["学生", "经常加班的人", "出租车司机", "来旅游的外国人"], "k": 1, "e": "Văn bản nói đây là tin tốt đối với người thường xuyên tăng ca."}, {"txt": "我坐的公共汽车上人特别多，一位老人上车后没有座位。一个年轻的小伙子马上站起来，把座位让给了他。老人笑着说：“谢谢你，现在这样的年轻人不多了。”", "q": "★ 小伙子做了什么？", "o": ["帮老人拿行李", "给老人买水", "把座位让给老人", "送老人回家"], "k": 2, "e": "Chàng trai đứng dậy nhường chỗ ngồi cho cụ già."}, {"txt": "很多人以为去西藏旅游一定会不舒服，其实只要慢慢适应，大部分人都没有问题。刚到的时候不要做运动，多喝水，早点儿休息，就可以了。", "q": "★ 刚到西藏时应该怎么做？", "o": ["马上去爬山", "少喝水", "晚点儿睡觉", "多喝水，多休息"], "k": 3, "e": "Đoạn văn khuyên mới đến thì đừng vận động, uống nhiều nước, nghỉ sớm."}, {"txt": "这家饭馆虽然不大，但是做的鱼非常好吃，所以每天都有很多人排队。如果你想吃，最好早一点儿去，或者提前打电话预约。", "q": "★ 想去这家饭馆吃饭，应该怎么做？", "o": ["中午再去", "带朋友去", "提前预约或早点儿去", "点别的菜"], "k": 2, "e": "Văn bản khuyên nên đi sớm hoặc gọi điện đặt trước."}, {"txt": "李明开车去外地，路上看见一个路牌写着“前方施工，请绕行”。他按照提示换了另一条路，结果比平时多走了半个小时。", "q": "★ 李明为什么晚到了？", "o": ["走了更远的路", "车坏了", "忘带地图", "起得太晚"], "k": 0, "e": "Do phải đi đường vòng nên mất thêm nửa tiếng."}, {"txt": "我对机场的印象很深。每次来这儿，都能看到有人在这里欢迎亲人回家，也有人在这里和朋友告别。机场里有笑声，也有眼泪。", "q": "★ 这段话主要说机场里什么？", "o": ["有很多商店", "有欢聚也有告别", "服务很好", "价格很高"], "k": 1, "e": "Có người đón người thân, có người chia tay: vừa đoàn tụ vừa tạm biệt."}, {"txt": "为了保护环境，这个景区不再提供塑料袋，游客可以自己带包，或者花一块钱买一个纸袋。景区负责人说，这样每个月能减少很多垃圾。", "q": "★ 景区为什么不提供塑料袋？", "o": ["塑料袋太贵", "游客不喜欢", "没有地方放", "为了保护环境"], "k": 3, "e": "Câu đầu nêu rõ là để bảo vệ môi trường."}, {"txt": "我的朋友小周喜欢摄影，每次旅行，他的行李里最重的不是衣服，而是相机。他说，旅行的意义就是把美丽的地方留在照片里。", "q": "★ 小周的行李里最重的是什么？", "o": ["衣服", "书", "相机", "礼物"], "k": 2, "e": "Đoạn văn nói thứ nặng nhất không phải quần áo mà là máy ảnh."}, {"txt": "在国外租车自己开，虽然更自由，但是要注意很多事情：第一，要有国际驾驶证；第二，要了解当地的交通规则；第三，要买保险。", "q": "★ 在国外租车，需要什么？", "o": ["很多现金", "国际驾驶证", "大行李箱", "翻译软件"], "k": 1, "e": "Điều thứ nhất được nêu là phải có bằng lái quốc tế."}], "W1": [{"w": ["我", "把", "护照", "忘在", "出租车上了"], "a": ["我把护照忘在出租车上了。"]}, {"w": ["这趟", "比", "高铁", "那趟", "更快"], "a": ["这趟高铁比那趟更快。"]}, {"w": ["房间", "被", "已经", "订满了", "客人们"], "a": ["房间已经被客人们订满了。"]}, {"w": ["去机场", "怎么", "这儿", "走", "从"], "a": ["从这儿去机场怎么走？"]}, {"w": ["他", "对", "历史", "很", "感兴趣", "旅行时"], "a": ["旅行时他对历史很感兴趣。", "他旅行时对历史很感兴趣。"]}], "W2": [{"w": "行李", "hint": "Một người đang kéo hai chiếc vali lớn đi vào sảnh sân bay.", "a": "他拖着两个很重的行李走进了机场。"}, {"w": "地图", "hint": "Hai du khách đứng trên phố, một người cầm bản đồ giấy để tìm đường.", "a": "他们看着地图，想找到那家饭馆。"}, {"w": "迟到", "hint": "Một cô gái nhìn đồng hồ và vội vã chạy ra trạm xe buýt.", "a": "她怕上班迟到，所以跑着去了公共汽车站。"}]}, {"id": 4, "title": "Đề 4", "topics": "Sức khỏe, thể thao, ăn uống, thói quen sinh hoạt", "L1": [{"a": "医生说我最近血压有点儿高，让我少吃盐，每天坚持散步半个小时，一个月以后再来检查。", "s": "医生让他多吃盐。", "t": false, "e": "Bác sĩ bảo anh ấy ăn ít muối (少吃盐), không phải nhiều."}, {"a": "我以前很不爱吃早饭，后来发现不吃早饭上午会没精神，现在每天都吃一个鸡蛋，喝一杯牛奶。", "s": "他现在每天吃早饭。", "t": true, "e": "Hiện giờ ngày nào anh ấy cũng ăn một quả trứng và uống một cốc sữa."}, {"a": "昨天晚上的足球比赛非常精彩，上半场一比一，下半场我们队又进了两个球，最后三比一赢了。", "s": "他们队输了比赛。", "t": false, "e": "Kết quả cuối cùng là ba một, đội họ thắng."}, {"a": "很多人觉得游泳只是夏天的运动，其实一年四季都可以游，尤其是在室内游泳馆，冬天也很舒服。", "s": "冬天也可以去游泳。", "t": true, "e": "Đoạn nghe nói bốn mùa đều bơi được, mùa đông ở bể trong nhà cũng rất dễ chịu."}, {"a": "妈妈做的饺子又大又好吃，可是她自己吃得很少，总是说怕胖，把好吃的都留给我们。", "s": "妈妈吃了很多饺子。", "t": false, "e": "Mẹ tự ăn rất ít vì sợ béo, để phần ngon cho các con."}], "L2": [{"d": [["女", "你的脸色不太好，是不是没睡好？"], ["男", "是啊，昨晚看球赛看到两点。"]], "q": "男的为什么没睡好？", "o": ["工作太忙", "看球赛看得很晚", "牙疼", "天气太热"], "k": 1, "e": "Nam nói tối qua xem bóng đá đến hai giờ sáng."}, {"d": [["男", "医生，我嗓子很疼，还有点儿咳嗽。"], ["女", "先吃药，多喝热水，明天再不好就来医院。"]], "q": "医生建议男的做什么？", "o": ["马上住院", "别喝水", "多喝热水", "去跑步"], "k": 2, "e": "Bác sĩ khuyên uống thuốc và uống nhiều nước ấm."}, {"d": [["女", "你每天跑步多长时间？"], ["男", "不一定，忙的时候二十分钟，不忙的时候一个小时。"]], "q": "男的是什么意思？", "o": ["每天都跑一小时", "不爱跑步", "从不跑步", "时间不固定"], "k": 3, "e": "Nam nói 不一定: lúc bận 20 phút, lúc rảnh một giờ, tức thời gian không cố định."}, {"d": [["男", "这个菜太辣了，我吃不了。"], ["女", "那我给你要一碗白米饭，再点个不辣的汤。"]], "q": "女的打算做什么？", "o": ["给男的要米饭和汤", "换一家饭馆", "自己吃完", "不吃了"], "k": 0, "e": "Nữ nói sẽ gọi cho nam một bát cơm và một món canh không cay."}, {"d": [["女", "听说你参加了马拉松？"], ["男", "对，不过只跑了一半，腿就疼得走不动了，我只好放弃了。"]], "q": "男的怎么了？", "o": ["跑完了全程", "得了第一名", "没跑完", "没去参加"], "k": 2, "e": "Nam chỉ chạy được một nửa thì đau chân nên bỏ cuộc."}, {"d": [["男", "你怎么不喝饮料，改喝白水了？"], ["女", "医生说我吃糖太多，要少喝甜的。"]], "q": "女的为什么不喝饮料了？", "o": ["要少吃糖", "不喜欢", "太贵", "饮料没了"], "k": 0, "e": "Bác sĩ bảo nữ ăn quá nhiều đường nên phải uống ít đồ ngọt."}, {"d": [["女", "明天早上你陪我去公园打太极拳吧？"], ["男", "太早了吧，几点开始？"], ["女", "六点。"]], "q": "男的觉得怎么样？", "o": ["很有意思", "不想学", "时间合适", "有点儿早"], "k": 3, "e": "Nam nói \"太早了吧\", tức là thấy hơi sớm."}, {"d": [["男", "你的眼睛怎么红了？"], ["女", "我对着电脑工作了一整天，眼睛累极了。"]], "q": "女的眼睛为什么红？", "o": ["哭了", "看电脑太久", "感冒了", "没戴眼镜"], "k": 1, "e": "Nữ nhìn máy tính cả ngày nên mắt mệt và đỏ."}], "L3": [{"d": [["女", "最近你瘦了不少，是在减肥吗？"], ["男", "对，我每天晚饭后都去公园走一个小时。"], ["女", "只靠运动，不控制饮食吗？"], ["男", "我也少吃了甜的和油多的东西，但是没有完全不吃。"], ["女", "这样很好，减肥不能太着急。"], ["男", "是啊，医生也说健康最重要。"]], "q": "男的是怎么减肥的？", "o": ["运动并控制饮食", "只吃水果", "不吃晚饭", "吃药"], "k": 0, "e": "Nam đi bộ mỗi ngày và cũng ăn ít đồ ngọt, đồ nhiều dầu mỡ."}, {"d": [["男", "你为什么不去参加公司的篮球比赛？"], ["女", "我下个月要考试，需要多复习。"], ["男", "可是整天坐着看书对身体不好。"], ["女", "你说得对，那我每天打半个小时乒乓球吧，既能休息，又不浪费太多时间。"], ["男", "这主意不错。"]], "q": "女的最后决定做什么？", "o": ["参加篮球比赛", "不再复习", "放弃考试", "每天打乒乓球"], "k": 3, "e": "Nữ quyết định mỗi ngày chơi nửa tiếng bóng bàn."}, {"d": [[ 作十几个小时，可是他从来不抱怨。他说，看到病人一天比一天好，是他最大的快乐。", "q": "★ 李医生为什么不抱怨？", "o": ["工资很高", "不累", "有助手", "看到病人好起来很快乐"], "k": 3, "e": "Bác sĩ nói thấy bệnh nhân khỏe dần là niềm vui lớn nhất."}, {"txt": "我以前不爱吃蔬菜，后来妈妈把蔬菜做成饺子和包子，我发现味道很不错，现在已经不再讨厌蔬菜了。", "q": "★ 妈妈用什么办法让“我”吃蔬菜？", "o": ["给我零花钱", "把蔬菜做成饺子和包子", "不做别的菜", "讲故事给我听"], "k": 1, "e": "Mẹ làm rau thành sủi cảo và bánh bao."}, {"txt": "跑步的时候，穿一双合适的鞋子非常重要。鞋子太小会让脚疼，太大又容易摔倒。买鞋最好在下午去，因为那时候脚稍微大一点儿，选出来的鞋更合适。", "q": "★ 为什么建议下午买鞋？", "o": ["下午人少", "下午便宜", "下午脚稍微大一点儿", "下午商店才开门"], "k": 2, "e": "Buổi chiều chân hơi to hơn nên chọn giày vừa hơn."}, {"txt": "我们的饮食习惯和健康有很大关系。吃得太咸，容易得高血压；吃得太油，容易变胖。所以，饮食清淡一点儿对身体更好。", "q": "★ 这段话的主要意思是什么？", "o": ["要多吃肉", "要少吃饭", "饭后要散步", "饮食要清淡"], "k": 3, "e": "Câu kết luận nói ăn thanh đạm tốt cho cơ thể hơn."}, {"txt": "为了让孩子们喜欢运动，学校每天增加了半个小时的活动时间，学生们可以自己选择踢足球、跳绳或者打篮球。结果，孩子们的精神比以前好多了。", "q": "★ 学校做了什么？", "o": ["增加了活动时间", "取消了考试", "减少了作业", "换了老师"], "k": 0, "e": "Trường mỗi ngày tăng thêm nửa tiếng thời gian hoạt động."}], "W1": [{"w": ["他", "每天", "都", "坚持", "跑步"], "a": ["他每天都坚持跑步。", "每天他都坚持跑步。"]}, {"w": ["医生", "让", "我", "少", "喝酒"], "a": ["医生让我少喝酒。"]}, {"w": ["这场", "被", "比赛", "取消了", "大雨"], "a": ["这场比赛被大雨取消了。"]}, {"w": ["你", "最", "喜欢", "什么", "运动"], "a": ["你最喜欢什么运动？"]}, {"w": ["他的", "身体", "比", "去年", "好多了"], "a": ["他的身体比去年好多了。"]}], "W2": [{"w": "感冒", "hint": "Một cậu bé đeo khẩu trang, đang hắt hơi và cầm khăn giấy.", "a": "他感冒了，所以戴着口罩去上学。"}, {"w": "水果", "hint": "Một người phụ nữ đang chọn trái cây ở quầy trong siêu thị.", "a": "她在超市里挑选新鲜的水果。"}, {"w": "游泳", "hint": "Hai cha con đang bơi trong bể bơi.", "a": "周末爸爸带着儿子去游泳。"}]}, {"id": 5, "title": "Đề 5", "topics": "Học tập, trường học, thi cử, giáo dục con cái", "L1": [{"a": "明天下午学校要开家长会，老师希望每位同学的爸爸或妈妈都能参加。会议大概一个小时，请大家不要迟到。", "s": "家长会在明天上午开。", "t": false, "e": "Đoạn nghe nói họp phụ huynh vào chiều mai (下午), không phải buổi sáng."}, {"a": "我弟弟这次数学考试得了九十八分，是全班最高的。妈妈很高兴，答应周末带他去公园玩。", "s": "弟弟数学考得很好。", "t": true, "e": "Em trai được 98 điểm, cao nhất lớp nên thi toán rất tốt."}, {"a": "图书馆的书最多可以借一个月，如果没看完，可以在网上申请再借十天。", "s": "借的书不能再延长时间。", "t": false, "e": "Có thể xin mượn thêm mười ngày trên mạng nên sách có thể gia hạn."}, {"a": "小李每天早上六点起床跑步，然后再吃早饭。他说这样一天都有精神，学习效率也更高。", "s": "小李跑步以后才吃早饭。", "t": true, "e": "Đoạn nghe nói chạy bộ xong 然后再 ăn sáng."}, {"a": "这次的汉语作文比赛，一共有三十多名留学生参加。因为题目很有意思，大家都写得很认真。", "s": "比赛的题目很难。", "t": false, "e": "Đoạn nghe nói đề rất thú vị (有意思), không phải khó."}], "L2": [{"d": [["女", "王老师，我这次考试没考好，您能帮我看看哪里错了吗？"], ["男", "当然可以，下课后你来办公室找我吧。"]], "q": "男的是什么意思？", "o": ["答应帮忙", "不想看卷子", "现在就下课", "今天不上班"], "k": 0, "e": "Thầy nói 当然可以, bảo cô đến văn phòng nên đồng ý giúp."}, {"d": [["男", "你的汉语进步真快，是怎么学的？"], ["女", "我每天都看一个中文电视节目，还跟中国同学聊天。"]], "q": "女的是怎么提高汉语的？", "o": ["去中国旅游", "看电视、聊天", "上辅导班", "每天写日记"], "k": 1, "e": "Cô nói mỗi ngày xem chương trình tiếng Trung và trò chuyện với bạn."}, {"d": [["女", "明天就考试了，你复习好了吗？"], ["男", "还差一点儿，今天晚上我打算再复习到很晚，把最后两课看完。"]], "q": "男的今天晚上打算做什么？", "o": ["早点儿睡觉", "去看电影", "复习功课", "参加考试"], "k": 2, "e": "Nam định tối nay ôn đến khuya cho xong hai bài cuối."}, {"d": [["男", "这个暑假你想让孩子参加什么班？"], ["女", "他喜欢画画，我想给他报一个美术班。"]], "q": "女的想让孩子学什么？", "o": ["游泳", "跳舞", "弹钢琴", "画画"], "k": 3, "e": "Con thích vẽ nên nữ muốn đăng ký lớp mỹ thuật."}, {"d": [["女", "你怎么还在教室？大家都去吃饭了。"], ["男", "这道题我还没做出来，做完再去。"]], "q": "男的为什么没去吃饭？", "o": ["不太饿", "要做完题", "老师找他", "忘记了"], "k": 1, "e": "Nam nói bài này chưa làm xong, làm xong mới đi."}, {"d": [["男", "听说你们学校的新教学楼已经建好了？"], ["女", "对，下个星期就开始用，教室比以前大多了。"]], "q": "关于新教学楼，可以知道什么？", "o": ["还没建好", "教室变小了", "下周开始用", "在学校外面"], "k": 2, "e": "Nữ nói tuần sau bắt đầu dùng, phòng học to hơn trước."}, {"d": [["女", "你为什么不选历史课？"], ["男", "我觉得太难了，要背的东西太多，还是选音乐课吧。"]], "q": "男的为什么不选历史课？", "o": ["时间不合适", "老师不好", "人太多", "内容太难背"], "k": 3, "e": "Nam nói quá khó, phải học thuộc quá nhiều thứ."}, {"d": [["男", "小李，你的笔记借我看看，行吗？"], ["女", "没问题，不过你要在明天上课前还给我。"]], "q": "女的要求男的做什么？", "o": ["明天还笔记", "帮她复习", "一起上课", "买新本子"], "k": 0, "e": "Nữ yêu cầu nam trả vở ghi trước giờ học ngày mai."}], "L3": [{"d": [["女", "张明，你们班这次的运动会准备得怎么样了？"], ["男", "还不错，大家都报了名，我报的是一千米。"], ["女", "你平时锻炼吗？"], ["男", "每周跑三次，不过最近天气冷，我跑得少了一点。"], ["女", "那要注意别感冒。"]], "q": "男的报了什么项目？", "o": ["篮球", "跳高", "一千米", "游泳"], "k": 2, "e": "Nam nói mình đăng ký chạy một nghìn mét."}, {"d": [["男", "小王，你女儿快上小学了吧？"], ["女", "对，九月就上一年级了，我有点儿担心她不适应。"], ["男", "别担心，我儿子去年也是这样，现在每天都高高兴兴去学校。"], ["女", "真的吗？那你有什么好办法？"], ["男", "多跟她讲讲学校里有意思的事，让她期待上学。"]], "q": "男的建议女的怎么做？", "o": ["多讲学校的趣事", "给孩子换学校", "让孩子早点儿睡", "自己陪着上课"], "k": 0, "e": "Nam khuyên kể nhiều chuyện thú vị ở trường để con mong được đi học."}, {"d": [["女", "李老师，听说你们学院要办一个汉语演讲比赛？"], ["男", "对，下个月十号，欢迎留学生参加。"], ["女", "我想参加，要准备什么？"], ["男", "先写一个五分钟的稿子，然后发给我看看。"], ["女", "好的，我今晚就开始写。"]], "q": "女的接下来要先做什么？", "o": ["交报名费", "写演讲稿", "找比赛地点", "打电话"], "k": 1, "e": "Thầy bảo trước hết viết bài phát biểu năm phút rồi gửi thầy xem."}, {"d": [["男", "这次考试你是不是又得第一了？"], ["女", "没有，这次我只考了第三，数学最后一道题我做错了。"], ["男", "第三也很不错啊！"], ["女", "可是我本来能考得更好，就是太粗心了。"], ["男", "下次认真检查一遍就行了。"]], "q": "女的为什么没得第一？", "o": ["生病了", "迟到了", "没复习", "太粗心"], "k": 3, "e": "Nữ nói vì quá bất cẩn nên làm sai câu toán cuối."}], "L3p": [{"txt": "我小时候最怕写作业。有一次，妈妈没有直接批评我，而是坐在我旁边，陪我一起看书。她说，学习不是为了别人，而是为了让自己以后有更多选择。从那以后，我慢慢爱上了读书。现在我也是一位妈妈，我会用同样的方法教育自己的孩子。", "qs": [{"q": "“我”小时候最怕什么？", "o": ["考试", "写作业", "妈妈", "数学"], "k": 1, "e": "Câu đầu: hồi nhỏ tôi sợ nhất là làm bài tập."}, {"q": "妈妈是怎么做的？", "o": ["批评“我”", "给“我”买新书", "带“我”去旅游", "陪“我”一起看书"], "k": 3, "e": "Mẹ không phê bình mà ngồi cạnh cùng đọc sách."}]}, {"txt": "各位同学，下个星期三学校要举行一次期末考试说明会，地点在二楼的大会议室，时间是下午三点。会上老师会介绍考试的时间安排和注意事项。请大家带上笔和本子，准时参加。没有参加的同学，可以向班长要会议材料。", "qs": [{"q": "说明会在哪儿举行？", "o": ["二楼会议室", "图书馆", "操场", "教室"], "k": 0, "e": "Địa điểm là phòng họp lớn ở tầng hai."}, {"q": "没参加的同学可以怎么办？", "o": ["找校长", "重新考试", "不用管", "问班长要材料"], "k": 3, "e": "Bạn vắng mặt có thể xin lớp trưởng tài liệu họp."}]}, {"txt": "很多父母希望孩子多学几样本领，所以周末给孩子报很多班。但专家说，孩子也需要玩的时间。如果每天都很累，孩子可能会对学习失去兴趣。最好的办法是让孩子自己选择，真正喜欢的才会坚持下去。", "qs": [{"q": "专家认为孩子也需要什么？", "o": ["更多的班", "更好的老师", "更多作业", "玩的时间"], "k": 3, "e": "Chuyên gia nói trẻ cũng cần có thời gian chơi."}, {"q": "最好的办法是什么？", "o": ["让孩子少睡觉", "让孩子自己选择", "让老师来决定", "不让孩子上课"], "k": 1, "e": "Cách tốt nhất là để trẻ tự lựa chọn."}]}], "R1": {"words": ["终于", "坚持", "丰富", "为了", "否则", "简单"], "items": [{"s": "学习汉语最重要的是要（　）练习，不能只靠听课。", "k": 1, "e": "坚持练习: kiên trì luyện tập."}, {"s": "这次考试的题目比我想象的（　）多了。", "k": 5, "e": "简单多了: dễ hơn nhiều so với tưởng tượng."}, {"s": "（　）能听懂老师的话，他每天都提前预习课文。", "k": 3, "e": "为了 + mục đích: để nghe hiểu thầy cô."}, {"s": "他读了很多书，知识非常（　）。", "k": 2, "e": "知识丰富: kiến thức phong phú."}, {"s": "我（　）把作业写完了，现在可以出去玩了。", "k": 0, "e": "终于: cuối cùng cũng làm xong."}]}, "R2": [{"p": ["所以他决定先去图书馆查资料", "老师给小明布置了一篇关于环保的作文", "但是他对这个题目了解得不多"], "k": "BCA", "e": "B nêu đề bài, C có 但是 nói chưa hiểu nhiều, A có 所以 nêu quyết định."}, {"p": ["结果考试成绩比上次提高了二十分", "这个学期，小红每天晚上都坚持复习", "她的努力终于有了回报"], "k": "BAC", "e": "B nêu việc làm, A là kết quả, C kết luận nỗ lực có đền đáp."}, {"p": ["我学习汉语已经三年了", "开始的时候，我觉得汉字特别难写", "现在我已经能用汉语写日记了"], "k": "ABC", "e": "A giới thiệu, B nói lúc đầu, C nói hiện tại."}, {"p": ["孩子的成长离不开父母的教育", "因此，父母要为孩子做出好的样子", "父母的一言一行，孩子都看在眼里"], "k": "ACB", "e": "A nêu luận điểm, C nêu lý do, B có 因此 là kết luận."}, {"p": ["这家书店的书又多又便宜", "我每个周末都会去那里待一下午", "离我家不远有一家小书店"], "k": "CAB", "e": "C giới thiệu hiệu sách, A tả đặc điểm, B nói việc tôi làm ở đó."}], "R3": [{"txt": "我们班新来了一位数学老师，他讲课特别有意思，常常用生活中的例子解释难题，所以同学们都很喜欢上他的课。", "q": "同学们为什么喜欢这位老师？", "o": ["讲课有意思", "作业很少", "长得年轻", "从不批评人"], "k": 0, "e": "Văn bản nói thầy giảng bài rất thú vị nên học sinh thích."}, {"txt": "小张去年开始学做饭，一开始连鸡蛋都煎不好。现在他不但能做十几个菜，还常常请朋友来家里吃饭。", "q": "关于小张，可以知道什么？", "o": ["去年开了饭馆", "一直很会做饭", "现在会做很多菜", "不喜欢请朋友"], "k": 2, "e": "Hiện giờ anh nấu được hơn chục món."}, {"txt": "现在很多学校都有“阅读课”，每周安排一节，让学生在图书馆里安静地读自己喜欢的书。老师说，阅读不仅能提高成绩，还能让孩子变得更有耐心。", "q": "阅读课还有什么好处？", "o": ["让孩子长高", "让孩子更有耐心", "让孩子少做作业", "让孩子早点儿回家"], "k": 1, "e": "Giáo viên nói đọc sách còn khiến trẻ kiên nhẫn hơn."}, {"txt": "通知：由于下周三有大雨，原定于当天举行的春游活动改到周五。请同学们提前准备好午饭和雨伞，早上七点半在校门口集合。", "q": "春游改到哪天了？", "o": ["周一", "周二", "周三", "周五"], "k": 3, "e": "Thông báo nói chuyển sang thứ Sáu."}, {"txt": "上个月我报名参加了一个游泳班，教练很严格，第一节课就要求我们在水里待二十分钟。虽然很累，但是我觉得自己进步很快。", "q": "游泳班的教练怎么样？", "o": ["很严格", "很年轻", "很有名", "很爱笑"], "k": 0, "e": "Văn bản nói huấn luyện viên rất nghiêm khắc."}, {"txt": "很多人认为只有在安静的地方才能学好。其实，研究发现，有些人在有轻轻的音乐的环境里学习效果更好。当然，每个人的习惯不同，要找到适合自己的方法。", "q": "这段话主要想说什么？", "o": ["学习时必须安静", "学习时不能听音乐", "要找适合自己的学习方法", "听音乐的人成绩好"], "k": 2, "e": "Câu cuối nhấn mạnh phải tìm cách hợp với bản thân."}, {"txt": "我的邻居王奶奶今年七十岁了，却在学习用手机。她说，孩子们都在国外，用手机可以天天和他们视频聊天，所以她一点儿也不觉得累。", "q": "王奶奶为什么学用手机？", "o": ["想玩游戏", "想找工作", "想买东西", "想和孩子视频聊天"], "k": 3, "e": "Bà nói dùng điện thoại để gọi video hằng ngày với con cái."}, {"txt": "小刚的书包里总是很乱，每次找东西都要花很长时间。昨天妈妈送给他三个小袋子，让他把书、本子和文具分开放。今天他一下子就找到了要用的东西。", "q": "妈妈送给小刚什么？", "o": ["三个小袋子", "一个新书包", "一本词典", "一个盒子"], "k": 0, "e": "Mẹ tặng cậu ba chiếc túi nhỏ."}, {"txt": "教育专家建议，孩子写作业时，父母最好不要坐在旁边一直看着。这样孩子会觉得不被相信，也不容易养成自己思考的习惯。家长可以在孩子做完以后再帮忙检查。", "q": "专家的建议是什么？", "o": ["孩子不用写作业", "父母应一直陪着", "孩子做完后再检查", "让老师来检查"], "k": 2, "e": "Chuyên gia khuyên đợi trẻ làm xong rồi mới giúp kiểm tra."}, {"txt": "这家书店在地铁站旁边，晚上十二点才关门。除了卖书，里面还有一个小咖啡馆，很多年轻人下班后喜欢来这里看书、聊天。", "q": "这家书店有什么特点？", "o": ["只卖旧书", "营业到很晚", "离学校很远", "不能喝咖啡"], "k": 1, "e": "Hiệu sách đến 12 giờ đêm mới đóng cửa."}], "W1": [{"w": ["作业", "老师了", "他", "把", "交给"], "a": ["他把作业交给老师了。"]}, {"w": ["图书馆里", "安静", "非常", "的", "环境"], "a": ["图书馆里的环境非常安静。"]}, {"w": ["小明", "被", "老师", "表扬", "了"], "a": ["小明被老师表扬了。"]}, {"w": ["能", "作业", "你", "交", "什么时候"], "a": ["你什么时候能交作业？"]}, {"w": ["虽然", "学习很忙", "但是", "他", "每天坚持锻炼"], "a": ["虽然学习很忙，但是他每天坚持锻炼。"]}], "W2": [{"w": "复习", "hint": "一个学生坐在桌前翻着书，准备考试。", "a": "我每天晚上都要复习今天学的内容。"}, {"w": "黑板", "hint": "老师站在教室里，在黑板上写字。", "a": "老师在黑板上写了一个汉字。"}, {"w": "礼物", "hint": "一个小女孩高兴地拆开一个包装好的盒子。", "a": "女儿正在高兴地打开生日礼物。"}]}, {"id": 6, "title": "Đề 6", "topics": "Văn hóa, lễ hội, nghệ thuật, phim ảnh, âm nhạc", "L1": [{"a": "春节是中国最重要的传统节日，很多人不管多忙，都会在除夕前赶回家，和家人一起吃年夜饭。", "s": "很多人春节前会回家。", "t": true, "e": "Đoạn nghe nói nhiều người dù bận cũng về nhà trước đêm giao thừa."}, {"a": "这部电影昨天晚上上映，我本来想去看，可是票全卖完了，只好改到周末再去。", "s": "我昨天晚上看了这部电影。", "t": false, "e": "Vé bán hết nên người nói chưa xem, đổi sang cuối tuần."}, {"a": "这位画家的作品很有名，下个月会在市博物馆展出，门票免费，欢迎大家去参观。", "s": "参观展览需要买票。", "t": false, "e": "Đoạn nghe nói vé miễn phí (免费)."}, {"a": "小美从五岁就开始学弹钢琴，现在已经能弹很多复杂的曲子了。她说音乐让她觉得很快乐。", "s": "小美喜欢弹钢琴。", "t": true, "e": "Cô nói âm nhạc khiến mình vui, học từ năm tuổi nên thích đàn."}, {"a": "今年的中秋节，我们一家人去了外婆家，大家一边吃月饼，一边聊天，一直到很晚才睡觉。", "s": "中秋节他们在自己家过的。", "t": false, "e": "Họ đã đến nhà bà ngoại chứ không ở nhà mình."}], "L2": [{"d": [["男", "听说周末有个京剧表演，你想去吗？"], ["女", "我从来没看过，不过听说很有意思，我们一起去吧。"]], "q": "女的是什么意思？", "o": ["不想去看", "同意去看", "以前看过", "没有票"], "k": 1, "e": "Nữ nói nghe thú vị, cùng đi nhé nên đồng ý đi xem."}, {"d": [["女", "你在听什么歌？声音真好听。"], ["男", "是一个年轻歌手的新歌，我已经听了一下午了。"]], "q": "男的在做什么？", "o": ["唱歌", "买光盘", "学跳舞", "听音乐"], "k": 3, "e": "Nam nói đã nghe cả buổi chiều, tức là đang nghe nhạc."}, {"d": [["男", "这个周末的灯会你去不去？"], ["女", "去啊，我还打算带上相机，把漂亮的灯都拍下来。"]], "q": "女的打算做什么？", "o": ["拍照片", "买灯", "买相机", "画画"], "k": 0, "e": "Nữ định mang máy ảnh chụp những chiếc đèn đẹp."}, {"d": [["女", "这部电影的结局让我哭了。"], ["男", "是吗？我觉得有点儿太伤心了，不太喜欢。"]], "q": "男的觉得结局怎么样？", "o": ["很有意思", "很短", "太伤心", "很奇怪"], "k": 2, "e": "Nam nói kết thúc hơi quá buồn."}, {"d": [["男", "你们学校的舞蹈表演什么时候开始？"], ["女", "晚上七点，不过你最好提前半个小时到，要不然找不到座位。"]], "q": "男的最好什么时候到？", "o": ["六点", "七点", "七点半", "六点半"], "k": 3, "e": "Bảy giờ bắt đầu, đến sớm nửa tiếng tức là sáu rưỡi."}, {"d": [["女", "你为什么每年都去参加那个音乐节？"], ["男", "因为那里的气氛特别好，还能认识很多喜欢音乐的朋友。"]], "q": "男的为什么去音乐节？", "o": ["气氛好，朋友多", "票很便宜", "离家很近", "要工作"], "k": 0, "e": "Nam nói không khí rất tốt và quen được nhiều bạn."}, {"d": [["男", "你的书法写得真漂亮，是跟谁学的？"], ["女", "我爷爷。他小时候就教我了，每天都要练一个小时。"]], "q": "女的跟谁学书法？", "o": ["老师", "爷爷", "同学", "爸爸"], "k": 1, "e": "Nữ nói học từ ông nội."}, {"d": [["女", "我想送朋友一件有中国特色的礼物，你有什么建议？"], ["男", "我觉得买一双筷子就不错。"]], "q": "男的建议买什么？", "o": ["一件衣服", "一本词典", "一双筷子", "一张地图"], "k": 2, "e": "Nam đề nghị mua một đôi đũa."}], "L3": [{"d": [["女", "周末你有什么安排吗？"], ["男", "我想去看一场话剧，朋友给了我两张票。"], ["女", "什么话剧？"], ["男", "《茶馆》，听说非常有名。"], ["女", "真不错，我也想去，可是周末要加班。"]], "q": "女的为什么不能去？", "o": ["要陪孩子", "票卖完了", "不感兴趣", "要加班"], "k": 3, "e": "Nữ nói cuối tuần phải tăng ca."}, {"d": [["男", "你刚从云南旅游回来，那里怎么样？"], ["女", "太美了，而且不同民族的节日很有特色。"], ["男", "你赶上什么节日了吗？"], ["女", "我正好赶上了他们的新年，大家穿上漂亮的民族衣服，一起唱歌跳舞，特别热闹。"], ["男", "听起来真有意思。"]], "q": "云南民族的节日有什么特点？", "o": ["大家一起开会", "大家唱歌跳舞", "大家去爬山", "大家比赛吃饭"], "k": 1, "e": "Nữ kể mọi người mặc trang phục dân tộc, cùng ca hát nhảy múa."}, {"d": [["女", "你最近怎么总是在画画？"], ["男", "我报了一个绘画班，老师说我画得不错。"], ["女", "学了多长时间了？"], ["男", "才两个月，不过我打算以后参加比赛。"], ["女", "加油！我相信你一定能得奖。"]], "q": "男的有什么打算？", "o": ["参加比赛", "开画展", "换老师", "去国外学习"], "k": 0, "e": "Nam nói sau này định tham gia cuộc thi."}, {"d": [["男", "这首歌是你唱的吗？没想到你唱得这么好。"], ["女", "谢谢，我小时候在学校的合唱团唱过。"], ["男", "那你为什么没有继续唱下去？"], ["女", "因为上大学以后课太多，没有时间了，不过我一直很喜欢唱歌。"]], "q": "女的为什么没有继续唱？", "o": ["生病了", "不喜欢了", "没有时间", "搬家了"], "k": 2, "e": "Nữ nói vì lên đại học nhiều môn nên không có thời gian."}], "L3p": [{"txt": "中国的京剧已经有二百多年的历史了。京剧演员的脸上常常画着不同颜色的图案，红色一般表示勇敢、可靠，白色一般表示不太好的人。第一次看京剧的人也许听不懂，但是只要看看脸的颜色，就能大概了解人物的性格。", "qs": [{"q": "京剧演员的脸上画着什么？", "o": ["不同的字", "各种动物", "不同颜色的图案", "一些数字"], "k": 2, "e": "Đoạn nghe nói mặt diễn viên vẽ hoa văn nhiều màu."}, {"q": "看脸的颜色可以了解什么？", "o": ["人物的性格", "演员的年龄", "故事的结局", "演出的时间"], "k": 0, "e": "Nhìn màu mặt có thể biết tính cách nhân vật."}]}, {"txt": "大家好，欢迎来到我们的“周末电影夜”活动。今晚放映的是一部有名的老电影，故事发生在八十年代的北京。电影一共两个小时，中间不休息，所以请大家提前去洗手间。放映时请把手机关掉，也不要大声说话。", "qs": [{"q": "电影的故事发生在什么时候？", "o": ["昨天", "十年前", "一百年前", "八十年代"], "k": 3, "e": "Câu đầu nói câu chuyện xảy ra vào những năm tám mươi."}, {"q": "放映的时候要注意什么？", "o": ["不能带朋友", "要关手机", "不能吃东西", "要坐前面"], "k": 1, "e": "Khi chiếu phải tắt điện thoại."}]}, {"txt": "我爸爸是一个照相爱好者。每到周末，他就带着相机去郊区，一拍就是一整天。刚开始，他拍的照片不太好，后来他看了很多书，还参加了一个照相小组，现在他的作品已经在网站上受到了很多人的喜欢。爸爸常说，兴趣需要时间慢慢培养。", "qs": [{"q": "爸爸周末常常做什么？", "o": ["去郊区照相", "在家睡觉", "去书店", "参加比赛"], "k": 0, "e": "Cuối tuần bố mang máy ảnh ra ngoại ô chụp cả ngày."}, {"q": "爸爸是怎么提高水平的？", "o": ["买新相机", "换工作", "找老师", "看书和参加小组"], "k": 3, "e": "Bố đọc nhiều sách và tham gia nhóm nhiếp ảnh."}]}], "R1": {"words": ["部分", "感动", "几乎", "节目", "传统", "熟悉"], "items": [{"s": "这部电影的故事让所有观众都深深地（　）。", "k": 1, "e": "感动: khiến khán giả xúc động."}, {"s": "中国的（　）节日里，大家常常会吃特别的食物。", "k": 4, "e": "传统节日: lễ hội truyền thống."}, {"s": "这首歌我听过很多遍，对它的曲子非常（　）。", "k": 5, "e": "熟悉: nghe nhiều lần nên rất quen thuộc."}, {"s": "晚会上的（　）一个接一个，观众们不停地鼓掌。", "k": 3, "e": "节目: các tiết mục nối tiếp nhau."}, {"s": "这座城市的老房子，有一（　）已经被保护起来了。", "k": 0, "e": "一部分: một phần."}]}, "R2": [{"p": ["观众们看完以后都站起来鼓掌", "昨天晚上的话剧演得非常精彩", "演员们的表演让大家忘记了时间"], "k": "BCA", "e": "B nêu vở kịch hay, C nói diễn xuất, A là phản ứng sau khi xem xong."}, {"p": ["小英从小就喜欢中国文化", "于是她决定去北京学习京剧", "十八岁那年，她看了一场京剧表演"], "k": "ACB", "e": "A nêu sở thích từ nhỏ, C là sự kiện, B có 于是 là quyết định."}, {"p": ["展览从九月一日开始", "想参观的人可以提前在网上预约", "这次展览介绍的是中国传统的画"], "k": "CAB", "e": "C giới thiệu triển lãm, A nói thời gian, B hướng dẫn đặt trước."}, {"p": ["可是他的老师告诉他不能着急", "小林学画画才三个月，就想画出一幅最好的画", "只有慢慢地练习，才能越画越好"], "k": "BAC", "e": "B nêu mong muốn, A có 可是 chuyển ý, C là lời khuyên của thầy."}, {"p": ["这个周末，学校举办了第一次文化节", "有跳舞、唱歌，还有各国的美食", "同学们都玩得很开心"], "k": "ABC", "e": "A giới thiệu sự kiện, B liệt kê hoạt động, C kết quả."}], "R3": [{"txt": "中国的春节有很多习惯，比如贴红色的画、挂红色的灯，给孩子红包。红色在中国人眼里是吉利的颜色，所以春节时到处都能看到红色。", "q": "春节时为什么到处是红色？", "o": ["红色最便宜", "红色代表吉利", "红色是国旗的颜色", "孩子们喜欢红色"], "k": 1, "e": "Văn bản nói màu đỏ là màu may mắn trong mắt người Trung Quốc."}, {"txt": "昨天我第一次去看了现场演唱会。几万人一起唱同一首歌，那种感觉和在家里听完全不一样，我到现在还很激动。", "q": "他觉得演唱会怎么样？", "o": ["太吵了", "很无聊", "和在家听不一样", "票价太贵"], "k": 2, "e": "Anh nói cảm giác khác hoàn toàn so với nghe ở nhà."}, {"txt": "这家电影院虽然不大，但是常常放一些老电影。每周六晚上还有一位老先生在放映前讲电影的故事，所以很多喜欢电影的人都愿意来。", "q": "人们为什么愿意去这家电影院？", "o": ["能听到电影的故事", "电影院很大", "票很便宜", "离家很近"], "k": 0, "e": "Mỗi thứ Bảy có ông lão kể chuyện về phim trước khi chiếu."}, {"txt": "今天是元宵节，晚上街上挂满了漂亮的灯，孩子们提着小灯到处玩。我和女儿也出去走了走，还玩了游戏，得到了一个小礼物。", "q": "他们元宵节晚上做了什么？", "o": ["在家看电视", "去爬山", "去买新衣服", "出去看灯、玩游戏"], "k": 3, "e": "Hai bố con ra ngoài ngắm đèn và chơi trò chơi."}, {"txt": "这位作家写了很多关于小城市生活的小说。他说，最好的故事往往来自普通人的生活，所以他每天都到街上走走，听别人聊天。", "q": "作家从哪里得到故事？", "o": ["电视和报纸", "普通人的生活", "自己的梦", "国外的书"], "k": 1, "e": "Ông nói chuyện hay nhất đến từ cuộc sống của người bình thường."}, {"txt": "学校的合唱比赛下周五举行，每个班要选一首歌。我们班本来想唱英文歌，后来大家觉得唱中国歌更有意义，所以改成了一首民歌。", "q": "他们班最后选了什么歌？", "o": ["英文歌", "流行歌", "民歌", "儿歌"], "k": 2, "e": "Cuối cùng lớp đổi thành một bài dân ca."}, {"txt": "去年我在西安参观了兵马俑。看到几千个和真人一样大的像站在一起，我非常吃惊。导游说，每个像的脸都不一样。", "q": "导游说兵马俑有什么特别？", "o": ["每个像的脸都不一样", "都是红色的", "都在水里", "都很小"], "k": 0, "e": "Hướng dẫn viên nói mặt mỗi tượng đều khác nhau."}, {"txt": "很多年轻人喜欢拍短视频记录生活，但有些人为了让更多人喜欢，做一些危险的事情。专家提醒大家，安全比什么都重要。", "q": "专家提醒大家什么？", "o": ["多拍视频", "少看视频", "要买好相机", "安全最重要"], "k": 3, "e": "Chuyên gia nhắc an toàn quan trọng hơn mọi thứ."}, {"txt": "我的同屋是个爱看书的人，床边总是放着几本书。他说，读一本好书就像和一位聪明的朋友聊天，不但能学到知识，心情也会变好。", "q": "同屋觉得读好书像什么？", "o": ["去旅游", "和朋友聊天", "做运动", "吃好吃的"], "k": 1, "e": "Anh ấy nói đọc sách hay như trò chuyện với người bạn thông minh."}, {"txt": "传统的剪纸艺术是用一把剪刀和一张红纸做出各种图案，比如花、鱼和动物。现在不少学校开设了剪纸课，让孩子们了解这门传统艺术。", "q": "学校开剪纸课是为了什么？", "o": ["让孩子做生意", "比赛得奖", "了解传统艺术", "省钱"], "k": 2, "e": "Nhà trường mở lớp để trẻ hiểu nghệ thuật truyền thống."}], "W1": [{"w": ["特别", "让", "我", "这部电影", "感动"], "a": ["这部电影让我特别感动。"]}, {"w": ["墙上", "把", "挂在了", "她", "画"], "a": ["她把画挂在了墙上。"]}, {"w": ["才", "开始", "演出", "晚上八点"], "a": ["演出晚上八点才开始。", "晚上八点演出才开始。"]}, {"w": ["比", "这首歌", "那首", "好听", "多了"], "a": ["这首歌比那首好听多了。"]}, {"w": ["弹", "他", "钢琴", "得", "很好"], "a": ["他钢琴弹得很好。"]}], "W2": [{"w": "照片", "hint": "一家人站在公园里，对着相机笑。", "a": "这张照片是我们去年春节拍的。"}, {"w": "表演", "hint": "几个孩子在舞台上跳舞，台下的人在鼓掌。", "a": "孩子们的表演非常精彩。"}, {"w": "参观", "hint": "一群人正走进一座博物馆的大门。", "a": "周末我们一起去参观博物馆吧。"}]}, {"id": 7, "title": "Đề 7", "topics": "Khoa học, thiên nhiên, môi trường, công nghệ, động vật", "L1": [{"a": "大熊猫每天要花十几个小时吃竹子，所以它们吃得很多，睡得也不少。", "s": "大熊猫每天吃东西的时间很长。", "t": true, "e": "Đoạn nghe nói gấu trúc mỗi ngày ăn trúc hơn chục tiếng, nên câu này đúng."}, {"a": "今天早上的气温只有三度，比昨天低了很多，出门的时候一定要多穿点儿衣服。", "s": "今天比昨天暖和。", "t": false, "e": "Hôm nay nhiệt độ thấp hơn hôm qua nhiều, tức là lạnh hơn, nên câu này sai."}, {"a": "我家附近新建了一个公园，里面种了很多树，周末有不少人去那儿跑步、散步。", "s": "公园里的树很少。", "t": false, "e": "Đoạn nghe nói trong công viên trồng rất nhiều cây, nên câu này sai."}, {"a": "手机用久了电池会变差，所以最好不要一边充电一边玩儿，这样对电池不好。", "s": "一边充电一边玩手机对电池不好。", "t": true, "e": "Đoạn nghe nói vừa sạc vừa chơi điện thoại không tốt cho pin, nên câu này đúng."}, {"a": "我小时候第一次去海边，不小心喝了一口海水，又咸又苦，到现在还记得。", "s": "他第一次去海边喝了海水。", "t": true, "e": "Người nói lần đầu ra biển đã vô tình uống một ngụm nước biển, nên câu này đúng."}], "L2": [{"d": [["女", "你看，窗外下雪了！"], ["男", "是啊，今年的第一场雪比去年晚了一个多月。"]], "q": "关于今年的雪，可以知道什么？", "o": ["下得很大", "一直没有下", "来得比较晚", "男的不喜欢"], "k": 2, "e": "Nam nói tuyết đầu mùa năm nay muộn hơn năm ngoái hơn một tháng."}, {"d": [["女", "这种花一个星期浇一次水就够了。"], ["男", "真的吗？我每天都浇，难怪叶子都黄了。"]], "q": "男的做错了什么？", "o": ["浇水太多", "浇水太少", "晒太阳太多", "忘了换盆"], "k": 0, "e": "Nam ngày nào cũng tưới nước, trong khi chỉ cần tuần một lần, nên tưới quá nhiều."}, {"d": [["女", "听说你养了一只小狗？"], ["男", "对，不过它特别爱叫，邻居已经来找过我两次了。"]], "q": "小狗有什么问题？", "o": ["总是生病", "不爱吃饭", "老是跑出去", "爱叫"], "k": 3, "e": "Nam nói chó rất hay sủa, hàng xóm đã tìm đến hai lần."}, {"d": [["男", "这个机器人能做饭吗？"], ["女", "不能，它主要是帮老人打扫房间，还能提醒他们吃药。"]], "q": "机器人主要能做什么？", "o": ["做饭", "打扫和提醒吃药", "教孩子学习", "买东西"], "k": 1, "e": "Nữ nói robot chủ yếu giúp người già dọn phòng và nhắc uống thuốc."}, {"d": [["女", "明天去爬山，天气预报怎么说？"], ["男", "上午晴，下午可能有雨，我们早点儿出发，中午前下山。"]], "q": "他们打算怎么做？", "o": ["改天再去", "早点儿出发", "晚上下山", "在山上住一晚"], "k": 1, "e": "Nam đề nghị xuất phát sớm và xuống núi trước trưa."}, {"d": [["男", "你的照相机真漂亮，是新买的吗？"], ["女", "不是，是我爸爸送给我的，他说让我多拍拍大自然。"]], "q": "照相机是怎么来的？", "o": ["自己买的", "朋友借的", "比赛得的", "爸爸送的"], "k": 3, "e": "Nữ nói máy ảnh là bố tặng."}, {"d": [["女", "这条河的水怎么这么清？"], ["男", "政府这几年花了很多钱处理污水，现在连鱼都回来了。"]], "q": "河水为什么变清了？", "o": ["处理了污水", "下了很多雨", "鱼把水弄干净了", "河变宽了"], "k": 0, "e": "Nam nói chính quyền bỏ nhiều tiền xử lý nước thải."}, {"d": [["男", "电脑又慢了，该买新的了吧？"], ["女", "先别买，我看是东西装得太多，删掉一些就快了。"]], "q": "女的认为电脑慢的原因是什么？", "o": ["太旧了", "电池坏了", "装的东西太多", "没有网络"], "k": 2, "e": "Nữ cho rằng cài quá nhiều thứ, xóa bớt là nhanh."}], "L3": [{"d": [["男", "你怎么买了这么多菜？"], ["女", "我想试试在阳台上种菜。"], ["男", "能种得好吗？"], ["女", "网上说只要有阳光，每天浇点水就行，我先种西红柿。"], ["男", "那等长大了，记得请我尝尝。"]], "q": "女的打算做什么？", "o": ["开一家菜店", "在阳台种菜", "学做饭", "搬新家"], "k": 1, "e": "Nữ nói muốn thử trồng rau trên ban công."}, {"d": [["女", "你听说了吗？下个月公司要开始用新的会议系统。"], ["男", "是需要装软件的那种吗？"], ["女", "对，用手机也能开会。"], ["男", "太好了，以后出差就不用赶回来了。"], ["女", "不过要先参加培训，下周三下午。"]], "q": "下周三下午要做什么？", "o": ["去出差", "见客户", "参加培训", "修电脑"], "k": 2, "e": "Nữ nói trước hết phải tham gia tập huấn vào chiều thứ Tư tuần sau."}, {"d": [["男", "这个夏天特别热，我家空调一直开着。"], ["女", "我听说森林多的地方会凉快一些。"], ["男", "真的？"], ["女", "对，树能挡住阳光，还能让空气变湿。"], ["男", "看来我们应该多种树。"]], "q": "女的说树有什么好处？", "o": ["让天气凉快一些", "让人睡得好", "让水变干净", "让风变大"], "k": 0, "e": "Nữ nói cây che nắng, làm không khí ẩm nên mát hơn."}, {"d": [["女", "这只鸟的叫声真好听，是什么鸟？"], ["男", "我也不认识，我用手机拍一下，软件能告诉我们。"], ["女", "这么神奇？"], ["男", "是啊，拍完几秒钟就出结果了。你看，是一种叫画眉的鸟。"], ["女", "原来是它，我只在书上见过。"]], "q": "他们是怎么知道鸟的名字的？", "o": ["问了老师", "查了书", "听别人说", "用手机软件"], "k": 3, "e": "Nam dùng phần mềm trên điện thoại chụp ảnh để nhận biết tên chim."}], "L3p": [{"txt": "蜜蜂是一种很勤劳的小动物。一只蜜蜂一天要飞很多次，才能带回一点点花蜜。春天的时候，花开得最多，蜜蜂也最忙。人们不仅吃它做的蜂蜜，还发现很多水果和蔬菜要靠蜜蜂帮忙才能结出果实。如果蜜蜂越来越少，我们的饭桌上就会少很多东西。", "qs": [{"q": "蜜蜂什么时候最忙？", "o": ["春天", "夏天", "秋天", "冬天"], "k": 0, "e": "Đoạn văn nói mùa xuân hoa nở nhiều nhất, ong cũng bận nhất."}, {"q": "蜜蜂减少会怎么样？", "o": ["花会开得更多", "蜂蜜会便宜", "饭桌上的食物会变少", "天气会变冷"], "k": 2, "e": "Đoạn cuối nói nếu ong ít đi, bàn ăn sẽ thiếu nhiều thứ."}]}, {"txt": "昨天晚上我和儿子一起看星星。他问我：“为什么星星晚上才出来？”我告诉他星星白天也在，只是太阳太亮，我们看不见。他又问：“那星星离我们远吗？”我说非常远，有的星星的光要走几百年才能到我们的眼睛里。儿子听完，睁大了眼睛，说长大了要当科学家。", "qs": [{"q": "为什么白天看不见星星？", "o": ["星星白天会睡觉", "星星白天会离开", "云太多了", "太阳太亮了"], "k": 3, "e": "Người bố giải thích do mặt trời quá sáng nên không thấy sao."}, {"q": "儿子听完后想做什么？", "o": ["去旅游", "当科学家", "看电视", "早点睡觉"], "k": 1, "e": "Con trai nói lớn lên muốn làm nhà khoa học."}]}, {"txt": "我最近开始把家里的垃圾分类。一开始很麻烦，要分成四种，我总是搞错。后来我在每个垃圾桶上贴了图片，孩子也跟着一起做，慢慢就习惯了。现在我们家每个星期少扔了一大袋垃圾，邻居看到后也开始学我们。", "qs": [{"q": "一开始他觉得垃圾分类怎么样？", "o": ["很有意思", "很麻烦", "很便宜", "很简单"], "k": 1, "e": "Đoạn văn nói lúc đầu rất phiền, hay phân loại nhầm."}, {"q": "让分类变容易的办法是什么？", "o": ["买了新桶", "请人帮忙", "少扔东西", "在垃圾桶上贴图片"], "k": 3, "e": "Anh ta dán hình lên từng thùng rác."}]}], "R1": {"words": ["保护", "而且", "其实", "温度", "无论", "污染"], "items": [{"s": "工厂排出的废气会（　）空气，对人的身体很不好。", "k": 5, "e": "Khí thải làm ô nhiễm không khí, cần từ 污染."}, {"s": "夏天室内的（　）最好不要调得太低，二十六度左右最舒服。", "k": 3, "e": "Nói về mức độ nóng lạnh, 温度 làm danh từ."}, {"s": "我们每个人都应该（　）环境，不乱扔东西。", "k": 0, "e": "保护环境 là cụm cố định."}, {"s": "他看起来很年轻，（　）已经五十岁了。", "k": 2, "e": "Chỗ trống mang nghĩa trái với vẻ ngoài, dùng 其实."}, {"s": "（　）天气多冷，爷爷每天早上都去公园锻炼。", "k": 4, "e": "Cấu trúc 无论……都……: bất kể."}]}, "R2": [{"p": ["然后把种子放进去，再盖上一层土", "种花的时候，先在盆里装上土", "每天浇一点水，过几天就会长出小芽"], "k": "BAC", "e": "Trình tự: 先 (B) rồi 然后 (A), sau đó tưới nước nảy mầm (C)."}, {"p": ["所以现在很多地方用太阳能发电", "太阳每天都会给我们提供大量的能量", "而且它不会让空气变脏"], "k": "BCA", "e": "Nêu mặt trời cung cấp năng lượng (B), 而且 bổ sung (C), 所以 là kết luận (A)."}, {"p": ["上个月朋友送给我一只小乌龟", "第一次见到它，我就被它的样子吸引了", "现在它已经是我们家重要的一员了"], "k": "ABC", "e": "Theo thời gian: tháng trước được tặng, lần đầu thấy, bây giờ."}, {"p": ["大家都说，这是一次很难忘的经历", "我们去森林里看了一晚上的星星", "暑假的时候，学校组织学生去山里参加夏令营"], "k": "CBA", "e": "Mở đầu bằng bối cảnh kỳ nghỉ hè (C), hoạt động (B), cảm nhận (A)."}, {"p": ["李教授做实验的时候特别仔细", "因此他的研究总是很可靠", "他把每次实验的结果都认真地记下来"], "k": "ACB", "e": "Giới thiệu giáo sư (A), cách làm (C), 因此 là kết quả (B)."}], "R3": [{"txt": "很多人觉得鱼没有感觉，其实不是这样。科学家发现，鱼也会疼，也会害怕。所以钓鱼以后，如果不打算吃，最好小心地把它放回水里。", "q": "这段话主要想说什么？", "o": ["鱼其实也有感觉", "钓鱼很容易", "鱼不能放回水里", "科学家喜欢钓鱼"], "k": 0, "e": "Đoạn văn nhấn mạnh cá cũng biết đau, biết sợ."}, {"txt": "现在很多手机都有“护眼模式”，屏幕会变得黄一点儿。医生说，这种模式确实能让眼睛舒服一些，但是最重要的还是少看手机，每看四十分钟就要休息一会儿。", "q": "医生认为最重要的是什么？", "o": ["买新手机", "少看手机，经常休息", "开护眼模式", "把屏幕调亮"], "k": 1, "e": "Bác sĩ nói quan trọng nhất là xem ít và nghỉ ngơi."}, {"txt": "北极熊住在很冷的地方，它们喜欢在冰上等着抓鱼。可是现在天气越来越热，冰越来越少，北极熊找吃的越来越难，有些甚至要游几天才能找到一块冰。", "q": "北极熊为什么越来越难找到吃的？", "o": ["鱼变少了", "人们抓走了它们", "冰变少了", "它们不爱游泳了"], "k": 2, "e": "Thời tiết nóng lên làm băng ít đi nên gấu khó kiếm ăn."}, {"txt": "小李是一名种茶的农民。以前他只能靠经验判断什么时候该浇水，现在他在地里放了几个小机器，机器能把土地的情况发到他的手机上，他坐在家里就知道该不该浇水了。", "q": "小李现在怎么知道该不该浇水？", "o": ["问邻居", "看天气", "凭经验", "看手机上的信息"], "k": 3, "e": "Máy nhỏ gửi tình hình đất đến điện thoại của anh ấy."}, {"txt": "春天的时候，我们小区的树上来了一对鸟。它们每天飞来飞去，一会儿找草，一会儿找虫子，很快就在树上做了一个小窝。没过多久，窝里就传出了小鸟的叫声。", "q": "这对鸟做了什么？", "o": ["搬了家", "吃了很多虫子", "在树上做了个窝", "教小鸟飞"], "k": 2, "e": "Đoạn văn nói chúng nhanh chóng làm một cái tổ nhỏ trên cây."}, {"txt": "电动汽车越来越受欢迎。它不用汽油，跑起来声音也小，对环境比较好。不过，它也有一个麻烦：充电需要时间，如果路上找不到充电的地方，就很不方便。", "q": "电动汽车的麻烦是什么？", "o": ["充电不方便", "声音太大", "污染环境", "价格很高"], "k": 0, "e": "Phiền toái là sạc cần thời gian, dọc đường khó tìm chỗ sạc."}, {"txt": "有人问：为什么冬天说话的时候嘴里会冒“白气”？其实，这是因为我们呼出来的空气里有水，天气冷的时候，这些水一下子就变成了小水滴，所以我们能看见。", "q": "嘴里冒白气是因为什么？", "o": ["嘴里太热", "吃了热的东西", "空气不干净", "呼出的水遇冷变成小水滴"], "k": 3, "e": "Hơi nước trong khí thở ra gặp lạnh thành giọt nhỏ."}, {"txt": "这个周末，科技馆有一场关于机器人的展览。参观的人可以和机器人下棋、聊天，还可以自己动手做一个小机器人。孩子十二岁以下的话，需要大人陪着一起去。", "q": "十二岁以下的孩子怎么才能参观？", "o": ["先买票", "有大人陪", "带上机器人", "提前一天预约"], "k": 1, "e": "Văn bản nói trẻ dưới 12 tuổi cần người lớn đi cùng."}, {"txt": "地球上有很多沙漠，但是沙漠并不是什么都没有。白天，沙漠里很热，很多小动物躲在沙子下面；到了晚上，天气凉快了，它们才出来找水和食物。", "q": "沙漠里的小动物什么时候出来？", "o": ["晚上", "早上", "中午", "下雨的时候"], "k": 0, "e": "Ban đêm trời mát, các con vật nhỏ mới ra tìm nước và thức ăn."}, {"txt": "我以前总是忘记给手机充电，后来朋友教我一个办法：每天晚上刷完牙，就把手机连上充电线。坚持了一个月，我就再也没忘过。", "q": "朋友教的办法是什么？", "o": ["买大电池", "少玩手机", "在固定的时间充电", "随身带充电器"], "k": 2, "e": "Mỗi tối đánh răng xong là cắm sạc, tức sạc vào thời điểm cố định."}], "W1": [{"w": ["这条河的水", "被", "工厂", "污染", "了"], "a": ["这条河的水被工厂污染了。"]}, {"w": ["他把", "实验", "结果", "记在", "本子上"], "a": ["他把实验结果记在本子上。"]}, {"w": ["科学家", "发现了", "一种", "新的", "动物"], "a": ["科学家发现了一种新的动物。"]}, {"w": ["这个机器人", "比", "我想的", "聪明", "多了"], "a": ["这个机器人比我想的聪明多了。"]}, {"w": ["无论", "天气", "怎么样", "他都", "去爬山"], "a": ["无论天气怎么样，他都去爬山。"]}], "W2": [{"w": "环境", "hint": "一群人在河边捡垃圾。", "a": "大家在河边捡垃圾，保护环境。"}, {"w": "温度", "hint": "一个人看着温度计，上面显示三十五度。", "a": "今天的温度已经三十五度了。"}, {"w": "网站", "hint": "一个女孩坐在电脑前查资料。", "a": "她正在网站上查关于熊猫的资料。"}]}, {"id": 8, "title": "Đề 8", "topics": "Kinh doanh, tiền bạc, tìm việc, phỏng vấn, quản lý", "L1": [{"a": "经理说，下周一的会议改到下午三点开，因为上午他要去机场接一位重要的客人。", "s": "会议改到上午了。", "t": false, "e": "Cuộc họp dời sang 3 giờ chiều, không phải buổi sáng, nên câu này sai."}, {"a": "这家公司最近招人，只要大学毕业、会说英语就可以来试试，不要求有工作经验。", "s": "这家公司要求应聘的人有工作经验。", "t": false, "e": "Đoạn nghe nói không yêu cầu có kinh nghiệm làm việc, nên câu này sai."}, {"a": "我每个月工资的一半都用来付房租，剩下的钱还要吃饭、坐车，所以一直存不下钱。", "s": "他每个月存不了多少钱。", "t": true, "e": "Anh ấy nói luôn không để dành được tiền, nên câu này đúng."}, {"a": "面试的时候，小王紧张得说不出话来，不过面试官很友好，一直笑着鼓励他，后来他慢慢放松了。", "s": "面试官对小王很友好。", "t": true, "e": "Người phỏng vấn luôn mỉm cười động viên, nên câu này đúng."}, {"a": "这个包打完折以后只要三百块，比原来便宜了一百五十块，我觉得很值得买。", "s": "这个包原来是四百五十块。", "t": true, "e": "300 cộng 150 bằng 450, nên câu này đúng."}], "L2": [{"d": [["女", "这个月的销售成绩怎么样？"], ["男", "比上个月好多了，卖了快两百台。"]], "q": "男的觉得这个月怎么样？", "o": ["不如上个月", "比上个月好", "和上个月一样", "还没有结果"], "k": 1, "e": "Nam nói tốt hơn tháng trước nhiều."}, {"d": [["男", "你为什么想换工作？"], ["女", "现在的公司离家太远了，每天上下班要花三个小时。"]], "q": "女的为什么想换工作？", "o": ["工资低", "不喜欢同事", "经理太严格", "离家太远"], "k": 3, "e": "Nữ nói công ty hiện tại cách nhà quá xa."}, {"d": [["女", "这家银行的利息比别家高，你可以把钱存在这儿。"], ["男", "好的，我下午就去办。"]], "q": "男的下午要做什么？", "o": ["存钱", "取钱", "借钱", "换钱"], "k": 0, "e": "Nữ khuyên gửi tiền ở đây, nam nói chiều sẽ đi làm."}, {"d": [["男", "你的简历写得不错，不过怎么没写上你做过的那份工作？"], ["女", "那只是暑假里做了一个月的临时工作，我觉得不太重要。"]], "q": "女的为什么没把那份工作写进简历？", "o": ["她忘记了", "工作的公司太小", "她觉得不重要", "做的时间太长"], "k": 2, "e": "Nữ nói cô thấy công việc đó không quan trọng."}, {"d": [["女", "这台电视现在买有优惠吗？"], ["男", "有，今天买这台电视，我们送一个音响。"]], "q": "今天买电视有什么优惠？", "o": ["打八折", "免费送货", "送一张卡", "送一个音响"], "k": 3, "e": "Nam nói mua tivi hôm nay được tặng một loa."}, {"d": [["男", "王经理明天要出差，会议你来主持吧。"], ["女", "我？我还没主持过呢。"]], "q": "男的让女的做什么？", "o": ["主持会议", "准备资料", "去出差", "接客人"], "k": 0, "e": "Nam bảo nữ chủ trì cuộc họp."}, {"d": [["女", "我们的新产品为什么卖得不好？"], ["男", "我觉得是广告做得太少了，很多人根本不知道它。"]], "q": "男的认为原因是什么？", "o": ["价格太高", "质量不好", "广告太少", "颜色不好看"], "k": 2, "e": "Nam cho rằng quảng cáo làm quá ít, nhiều người không biết."}, {"d": [["男", "我想申请信用卡，需要带什么东西？"], ["女", "带身份证和工作证明就可以了。"]], "q": "办信用卡需要带什么？", "o": ["护照和照片", "身份证和工作证明", "银行卡和照片", "简历和身份证"], "k": 1, "e": "Nữ nói chỉ cần mang chứng minh thư và giấy chứng nhận công tác."}], "L3": [{"d": [["男", "小张，你觉得这次的活动预算够不够？"], ["女", "我算了一下，还差一万块。"], ["男", "差在哪儿？"], ["女", "主要是场地太贵了。"], ["男", "那我们换个便宜点儿的地方吧。"]], "q": "预算不够的主要原因是什么？", "o": ["人太多", "广告太贵", "礼物太贵", "场地太贵"], "k": 3, "e": "Nữ nói chủ yếu là địa điểm quá đắt."}, {"d": [["女", "您好，我是来面试的。"], ["男", "请坐。你以前做过销售吗？"], ["女", "做过两年，在一家手机公司。"], ["男", "为什么离开了？"], ["女", "公司搬到了别的城市，我不想离开家人。"]], "q": "女的为什么离开上一家公司？", "o": ["公司搬到别的城市了", "工资太低", "被开除了", "想去学习"], "k": 0, "e": "Nữ nói công ty chuyển sang thành phố khác, cô không muốn rời xa gia đình."}, {"d": [["男", "你们部门这个月为什么总是加班？"], ["女", "有个大客户要求下个月就拿到产品。"], ["男", "那你们人手够吗？"], ["女", "不够，经理说下周会再招两个人。"], ["男", "希望能快点儿解决。"]], "q": "经理打算怎么解决问题？", "o": ["让客户等", "招新员工", "减少产品", "换个客户"], "k": 1, "e": "Nữ nói quản lý sẽ tuyển thêm hai người."}, {"d": [["女", "我想开一家小咖啡店，你觉得怎么样？"], ["男", "不错啊，不过你有没有想过钱从哪儿来？"], ["女", "我存了一些，不够的话打算向银行借。"], ["男", "先别急，最好找个有经验的人问问。"], ["女", "你说得对，我下周去请教我的一个老同学，他开过店。"]], "q": "女的下周打算做什么？", "o": ["去银行借钱", "租店面", "问一位开过店的朋友", "辞职"], "k": 2, "e": "Nữ nói tuần sau sẽ đi hỏi người bạn cũ từng mở tiệm."}], "L3p": [{"txt": "我刚当经理的时候，总觉得什么事都要自己做才放心，结果每天都累得要命，工作还做不好。后来一位老经理告诉我，管理的意思就是让别人把事情做好。从那以后，我学着相信同事，把任务交给他们，自己只检查结果。现在我轻松多了，团队的成绩也比以前好。", "qs": [{"q": "他刚当经理时是什么样的？", "o": ["很轻松", "总是迟到", "什么事都想自己做", "经常批评同事"], "k": 2, "e": "Lúc đầu anh ta việc gì cũng muốn tự làm mới yên tâm."}, {"q": "老经理认为管理是什么？", "o": ["让别人把事情做好", "自己多做事", "多开会", "少花钱"], "k": 0, "e": "Quản lý cũ nói quản lý là để người khác làm tốt công việc."}]}, {"txt": "小林大学毕业后，没有去大公司上班，而是和两个同学一起做了一个卖旧书的网站。刚开始一个月只卖了几十本，他们差点儿放弃。后来他们发现很多学生愿意用便宜的价格买书，于是把网站的重点放在学生身上，生意慢慢好起来。现在他们已经有二十多个员工了。", "qs": [{"q": "小林毕业后做了什么？", "o": ["去大公司上班", "和同学做了卖旧书的网站", "开了一家饭馆", "继续读书"], "k": 1, "e": "Anh ấy cùng bạn học làm một trang web bán sách cũ."}, {"q": "他们的生意为什么好起来了？", "o": ["价格涨了", "换了新同学", "做了很多广告", "把重点放在学生身上"], "k": 3, "e": "Họ chuyển trọng tâm của trang web sang học sinh sinh viên."}]}, {"txt": "现在很多年轻人喜欢用手机付钱，出门不带现金。这样确实方便，但也有一个问题：花钱的时候没有“拿出钱”的感觉，很容易花得太多。有人建议，每个月先给自己定一个数字，花到这个数字就停下来，这样可以帮助我们更好地管理钱。", "qs": [{"q": "用手机付钱有什么问题？", "o": ["容易花得太多", "速度很慢", "要带很多现金", "手机会没电"], "k": 0, "e": "Văn bản nói dễ tiêu quá tay vì không có cảm giác lấy tiền ra."}, {"q": "有人建议怎么做？", "o": ["少用手机", "多存现金", "每月先定好花钱的数字", "每天算账"], "k": 2, "e": "Lời khuyên là mỗi tháng định trước một con số, tiêu đến đó thì dừng."}]}], "R1": {"words": ["同意", "重要", "提高", "经验", "打折", "申请"], "items": [{"s": "他有五年的工作（　），所以公司马上就录用了他。", "k": 3, "e": "Chỗ trống cần danh từ, 工作经验 là kinh nghiệm làm việc."}, {"s": "我想（　）一张信用卡，但是不知道需要什么材料。", "k": 5, "e": "申请信用卡 là cụm đúng."}, {"s": "这家商店周末所有的衣服都（　），很多人都去买。", "k": 4, "e": "Quần áo giảm giá nên nhiều người mua, dùng 打折."}, {"s": "经理没有（　）我的计划，要我再改一改。", "k": 0, "e": "Quản lý bảo sửa lại nghĩa là không đồng ý kế hoạch."}, {"s": "这次会议很（　），所有部门的人都必须参加。", "k": 1, "e": "Mọi bộ phận đều phải tham gia nên cuộc họp rất quan trọng."}]}, "R2": [{"p": ["可是他没有放弃，继续寻找机会", "小刚找了三个月的工作，面试了十几家公司", "终于，一家大公司给他打来了电话"], "k": "BAC", "e": "Nêu việc tìm việc (B), 可是 chuyển ý (A), 终于 là kết quả (C)."}, {"p": ["这家饭馆的菜既便宜又好吃", "结果每天中午门口都排着长队", "老板见了客人总是笑着打招呼，大家都很喜欢他"], "k": "ACB", "e": "Nêu ưu điểm (A), thêm yếu tố ông chủ (C), 结果 là kết quả (B)."}, {"p": ["小李很想买一辆汽车", "可是他现在的工资还不够", "所以他决定先存钱，等存够了再买"], "k": "ABC", "e": "Muốn mua xe (A), 可是 nêu trở ngại (B), 所以 nêu quyết định (C)."}, {"p": ["大家听了这个消息都很高兴", "下个月公司要搬到新的办公楼", "新楼离地铁站很近，上班会方便很多"], "k": "BCA", "e": "Thông báo chuyển (B), 新楼 nói thêm (C), 这个消息 chỉ phản ứng ở cuối (A)."}, {"p": ["第一次开会，他紧张得手都在发抖", "不过后来他慢慢习惯了", "小陈刚进公司的时候，什么都不太熟悉"], "k": "CAB", "e": "Mở đầu bằng lúc mới vào công ty (C), sau đó cuộc họp đầu (A), 不过后来 ở cuối (B)."}], "R3": [{"txt": "小王去一家公司面试，面试官问他：“你觉得自己最大的缺点是什么？”小王想了想，说：“我有时候太认真了，会为一个小问题花很多时间。”面试官笑了。", "q": "小王说他的缺点是什么？", "o": ["太紧张", "太认真", "常迟到", "爱说话"], "k": 1, "e": "Vương nói mình đôi khi quá nghiêm túc."}, {"txt": "这家商店周年庆，所有的衣服都打七折，买满五百块还可以再减五十。不过打折的衣服不能退，买之前一定要想清楚。", "q": "关于打折的衣服，可以知道什么？", "o": ["只能买一件", "只有今天卖", "买满五百送衣服", "不能退"], "k": 3, "e": "Văn bản nói quần áo giảm giá không được trả lại."}, {"txt": "张先生每天上班要坐一个半小时的地铁。为了不浪费时间，他在地铁上读书、学外语。三年下来，他不但读了一百多本书，还通过了英语考试，后来很快就升职了。", "q": "张先生在地铁上做什么？", "o": ["读书学习", "睡觉", "玩儿游戏", "看电影"], "k": 0, "e": "Ông ấy đọc sách và học ngoại ngữ trên tàu điện."}, {"txt": "公司决定从下个月开始实行“弹性上班”，员工可以在早上八点到十点之间到公司，只要工作满八个小时就行。这样可以避开堵车的时间。", "q": "弹性上班的好处是什么？", "o": ["工资更高", "可以少工作", "能避开堵车", "可以在家工作"], "k": 2, "e": "Văn bản nói như vậy có thể tránh giờ tắc đường."}, {"txt": "我的邻居老周退休以后，开了一家修自行车的小店。他说钱挣得不多，但是每天都能见到很多人，不觉得孤单。", "q": "老周觉得开店有什么好处？", "o": ["能挣很多钱", "不觉得孤单", "能锻炼身体", "能帮助儿子"], "k": 1, "e": "Ông Chu nói mỗi ngày gặp nhiều người nên không thấy cô đơn."}, {"txt": "很多公司在招聘的时候，除了看学历，还会看应聘者的“态度”。一个态度好的人，即使经验少一点儿，也可以很快学会。所以面试时，笑一笑、回答问题时看着对方，都很重要。", "q": "这段话认为面试时什么很重要？", "o": ["穿得很贵", "带着礼物", "说得越多越好", "态度好，看着对方"], "k": 3, "e": "Văn bản nhấn mạnh thái độ tốt, mỉm cười, nhìn người đối diện."}, {"txt": "小美想把旧衣服卖掉，她拍了照片放到网上，没想到第二天就有三个人想买。她觉得很有意思，现在每个月都会卖一些不用的东西，一年能挣两千多块。", "q": "小美现在每个月做什么？", "o": ["买新衣服", "拍照片比赛", "卖不用的东西", "开网店学习"], "k": 2, "e": "Cô ấy mỗi tháng đều bán một số đồ không dùng."}, {"txt": "这个城市的房租越来越高，很多年轻人选择和别人一起租房。几个人分开付钱，每个人每月能省下一千多块，而且下班回家还有人聊天。", "q": "合租的好处之一是什么？", "o": ["能省不少钱", "房子更大", "离公司更近", "不用打扫"], "k": 0, "e": "Văn bản nói mỗi người mỗi tháng tiết kiệm hơn một nghìn tệ."}, {"txt": "张经理对新员工说：“不会做没关系，但是不明白的地方一定要问。如果你一个人想一整天，浪费的是公司的时间。”", "q": "张经理希望新员工怎么做？", "o": ["一个人想一整天", "有问题及时问", "辞职", "下班早点走"], "k": 1, "e": "Giám đốc Trương bảo chỗ nào chưa hiểu nhất định phải hỏi."}, {"txt": "银行提醒大家，最近有人假装银行工作人员打电话，说你的卡有问题，让你说出密码。银行说，他们从来不会在电话里问密码，遇到这样的电话请马上挂掉。", "q": "遇到这样的电话应该怎么办？", "o": ["告诉他密码", "去银行排队", "换一张卡", "马上挂掉"], "k": 3, "e": "Ngân hàng nhắc gặp cuộc gọi như vậy hãy cúp máy ngay."}], "W1": [{"w": ["请把", "这份", "简历", "发给", "我"], "a": ["请把这份简历发给我。"]}, {"w": ["经理", "对", "我的工作", "非常", "满意"], "a": ["经理对我的工作非常满意。"]}, {"w": ["这家公司", "的工资", "比", "别的公司", "高"], "a": ["这家公司的工资比别的公司高。"]}, {"w": ["他", "被", "公司", "录用", "了"], "a": ["他被公司录用了。"]}, {"w": ["你", "为什么", "想", "换", "工作"], "a": ["你为什么想换工作？"]}], "W2": [{"w": "面试", "hint": "一个年轻人坐在办公室里，对面坐着面试官。", "a": "他明天要去一家公司面试。"}, {"w": "银行", "hint": "一个女人在银行窗口前存钱。", "a": "她下班后去银行存钱。"}, {"w": "会议", "hint": "一群人围着桌子开会，一个人在讲话。", "a": "会议室里大家正在讨论新产品。"}]}, {"id": 9, "title": "Đề 9", "topics": "Tâm lý, tính cách, quan hệ giữa người với người, triết lý sống", "L1": [{"a": "有些人很容易紧张，一上台就忘词。其实这很正常，只要多练习几次，慢慢就会好的。", "s": "紧张的人多练习会变好。", "t": true, "e": "Đoạn nghe nói chỉ cần luyện tập nhiều lần thì sẽ dần khá hơn."}, {"a": "小李总是担心别人怎么看他，所以买衣服的时候要问很多朋友的意见。今天他终于自己决定买了一件黑色的外套。", "s": "小李今天又问了很多朋友的意见。", "t": false, "e": "Hôm nay Tiểu Lý cuối cùng đã tự quyết định, không hỏi bạn bè."}, {"a": "朋友之间最重要的是信任。如果你每次都怀疑对方，那么再好的关系也会慢慢变坏。", "s": "总是怀疑会影响朋友关系。", "t": true, "e": "Luôn nghi ngờ đối phương thì quan hệ tốt đến đâu cũng dần xấu đi."}, {"a": "我以前觉得成功就是赚很多钱，后来才明白，每天过得开心比什么都重要。", "s": "他现在认为赚钱最重要。", "t": false, "e": "Giờ anh ấy hiểu rằng mỗi ngày vui vẻ mới quan trọng hơn tất cả."}, {"a": "王老师性格很安静，不太爱说话，可是学生们遇到问题都愿意找她，因为她很会听别人说。", "s": "学生们不喜欢王老师。", "t": false, "e": "Học sinh có chuyện đều muốn tìm cô vì cô biết lắng nghe."}], "L2": [{"d": [["女", "你怎么看起来不太高兴？"], ["男", "我跟最好的朋友吵架了，不知道该不该先道歉。"]], "q": "男的在担心什么？", "o": ["跟朋友吵架的事", "工作太忙", "考试成绩", "搬家的问题"], "k": 0, "e": "Anh ấy nói đã cãi nhau với bạn thân và đang phân vân có nên xin lỗi trước."}, {"d": [["女", "你每次都这么乐观，是天生的吗？"], ["男", "不是，我只是觉得，生气和难过都解决不了问题。"]], "q": "男的是什么意思？", "o": ["他天生就很乐观", "他从来不难过", "生气难过没有用", "问题很容易解决"], "k": 2, "e": "Anh ấy nói tức giận và buồn bã đều không giải quyết được vấn đề."}, {"d": [["男", "你为什么总是帮别人做事，自己的事却没时间做？"], ["女", "我不好意思拒绝别人。"]], "q": "女的有什么问题？", "o": ["工作太多", "不喜欢帮助别人", "不会做饭", "不好意思拒绝别人"], "k": 3, "e": "Cô ấy nói ngại từ chối người khác."}, {"d": [["女", "听说你儿子特别害羞，在学校不爱发言？"], ["男", "是啊，不过我不着急，每个孩子成长的速度都不一样。"]], "q": "男的是什么态度？", "o": ["很着急", "不着急", "很生气", "很失望"], "k": 1, "e": "Anh ấy nói mình không vội, tốc độ trưởng thành mỗi đứa trẻ khác nhau."}, {"d": [["男", "你觉得他这个人怎么样？"], ["女", "第一次见面觉得他很冷淡，后来才发现他其实很热心。"]], "q": "女的对他的看法是什么？", "o": ["一直很冷淡", "觉得他很骄傲", "后来发现他很热心", "不想再见到他"], "k": 2, "e": "Ban đầu thấy lạnh nhạt, sau mới phát hiện anh ấy rất nhiệt tình."}, {"d": [["女", "我昨天在会议上说错了话，一晚上都没睡好。"], ["男", "别想了，大家早就忘了，只有你一直记着。"]], "q": "男的想让女的怎么做？", "o": ["别再想这件事", "再开一次会", "向大家道歉", "早点儿睡觉"], "k": 0, "e": "Anh ấy bảo đừng nghĩ nữa vì mọi người đã quên rồi."}, {"d": [["男", "这次比赛我输了，好丢脸啊。"], ["女", "输赢不重要，重要的是你比以前进步了。"]], "q": "女的觉得什么最重要？", "o": ["赢得比赛", "不要丢脸", "多交朋友", "自己的进步"], "k": 3, "e": "Cô ấy nói thắng thua không quan trọng, quan trọng là có tiến bộ."}, {"d": [["女", "你总是把钱借给别人，不怕他们不还吗？"], ["男", "如果他们真有困难，我愿意帮忙；不还的话，就当是买了个教训。"]], "q": "男的是什么态度？", "o": ["很后悔", "愿意帮助别人", "非常担心", "要去找他们"], "k": 1, "e": "Anh ấy nói nếu người ta thật sự khó khăn thì sẵn lòng giúp."}], "L3": [{"d": [["女", "周末的同学聚会你去吗？"], ["男", "我不想去，一想到要和那么多人说话就觉得累。"], ["女", "你不是性格挺外向的吗？"], ["男", "别人都这么说，其实我更喜欢一个人安静地看书。"]], "q": "男的真实的性格是什么样的？", "o": ["外向爱说话", "喜欢安静", "爱参加聚会", "很骄傲"], "k": 1, "e": "Anh ấy nói thật ra thích một mình yên tĩnh đọc sách."}, {"d": [["男", "你最近好像变了，变得爱笑了。"], ["女", "是啊，以前我总担心别人怎么看我，现在想明白了，没有人会一直关注你。"], ["男", "这个想法真好。"], ["女", "对，我只需要做好自己就可以了。"]], "q": "女的为什么变得爱笑了？", "o": ["换了新工作", "交了新朋友", "不再在意别人的看法", "生活变轻松了"], "k": 2, "e": "Cô ấy nghĩ thông rằng không ai chú ý mình mãi, nên không còn bận tâm ánh nhìn của người khác."}, {"d": [["女", "你看，这个孩子一直在等第二块糖。"], ["男", "这是那个很有名的实验吗？"], ["女", "对，能等十五分钟的孩子，长大后一般更有耐心，也更容易成功。"], ["男", "看来耐心真的很重要。"]], "q": "这个实验说明了什么？", "o": ["有耐心的人更容易成功", "孩子都喜欢吃糖", "吃糖会影响成绩", "实验要等很长时间"], "k": 0, "e": "Trẻ chờ được thì lớn lên kiên nhẫn hơn và dễ thành công hơn."}, {"d": [["男", "你为什么把这些旧信都留着？"], ["女", "这是我和大学同学之间写的信，看到它们，我就想起那些年轻的日子。"], ["男", "现在发短信多方便，谁还写信啊。"], ["女", "方便是方便，可是写信的时候，人会想得更认真。"], ["男", "这样说也对。"]], "q": "女的为什么喜欢写信？", "o": ["比发短信便宜", "字写得很好", "同学要求的", "写信时想得更认真"], "k": 3, "e": "Cô nói khi viết thư người ta suy nghĩ nghiêm túc hơn."}], "L3p": [{"txt": "有一种性格叫“完美主义”。完美主义的人对自己要求很高，做什么事都希望做到最好。这有好处，因为他们做事很认真；但也有坏处，他们常常因为一点小错误就觉得自己很失败，压力特别大。心理学家建议，我们可以试着告诉自己：“做完比做好更重要，先做完，再慢慢改进。”", "qs": [{"q": "完美主义的人有什么好处？", "o": ["压力很小", "朋友很多", "做事很认真", "身体很好"], "k": 2, "e": "Văn bản nói ưu điểm là họ làm việc rất nghiêm túc."}, {"q": "心理学家建议怎么做？", "o": ["先做完再改进", "不要做事情", "要求别人做到最好", "不怕压力"], "k": 0, "e": "Nhà tâm lý khuyên: làm xong quan trọng hơn làm tốt, làm xong rồi cải tiến dần."}]}, {"txt": "很多人觉得，朋友越多越好，其实不一定。有研究发现，一个人真正需要的、可以说心里话的朋友，一般只有三四个。如果把时间都花在应酬上，反而没有精力照顾真正重要的关系。所以，与其认识很多人，不如多花时间陪陪身边最重要的人。", "qs": [{"q": "研究发现，能说心里话的朋友一般有几个？", "o": ["一两个", "十几个", "二十个", "三四个"], "k": 3, "e": "Nghiên cứu nói thường chỉ có ba bốn người bạn có thể tâm sự."}, {"q": "这段话主要想说什么？", "o": ["要多参加应酬", "要重视少数重要的关系", "朋友越多越好", "不要认识新朋友"], "k": 1, "e": "Kết luận là thà dành thời gian cho người quan trọng bên cạnh hơn là quen thật nhiều người."}]}, {"txt": "我小时候很怕黑，晚上不敢一个人睡。爷爷没有批评我，而是带我到院子里散步，指着天上的星星对我说：“黑夜不可怕，它让我们看见了星星。”从那以后，我慢慢不怕黑了。现在遇到困难的时候，我还会想起爷爷的这句话：有些东西，只有在黑暗中才能看到。", "qs": [{"q": "爷爷是怎么帮助“我”的？", "o": ["带我去院子里看星星", "批评了我", "陪我一起睡觉", "给我买了一盏灯"], "k": 0, "e": "Ông dẫn tôi ra sân đi dạo và chỉ sao trên trời."}, {"q": "爷爷的话想说明什么？", "o": ["晚上不要出门", "星星很漂亮", "困难中也能发现好东西", "小孩应该早点儿睡"], "k": 2, "e": "Câu nói ý rằng trong bóng tối mới thấy được vài thứ, tức khó khăn cũng có điều tốt."}]}], "R1": {"words": ["缺点", "相信", "压力", "性格", "关系", "后悔"], "items": [{"s": "每个人都有优点，也都有（　），重要的是接受真实的自己。", "k": 0, "e": "“有优点也有缺点” là cách nói quen thuộc."}, {"s": "我（　）只要坚持努力，总有一天会成功的。", "k": 1, "e": "“相信 + mệnh đề” diễn tả niềm tin."}, {"s": "最近工作太多，我感觉（　）很大，晚上常常睡不着。", "k": 2, "e": "“压力很大” dẫn đến mất ngủ."}, {"s": "他的（　）很开朗，和谁都能很快成为朋友。", "k": 3, "e": "“开朗” mô tả tính cách (性格)."}, {"s": "好的夫妻（　）需要互相理解，也需要给对方一点空间。", "k": 4, "e": "“夫妻关系” là cụm cố định."}]}, "R2": [{"p": ["可是他从来没有放弃过", "小王学习汉语的时候，遇到了很多困难", "现在他已经可以用汉语写文章了"], "k": "BAC", "e": "B nêu tình huống, A “可是” chuyển ý, C nói kết quả “现在”."}, {"p": ["所以我们应该学会换个角度看问题", "同一件事，不同的人会有不同的感受", "有的人看到的是困难，有的人看到的是机会"], "k": "BCA", "e": "B nêu luận điểm, C minh họa, A “所以” rút ra kết luận."}, {"p": ["他性格比较内向，不太爱说话", "但是一说起足球，他就像变了一个人", "我的同桌是个很有意思的人"], "k": "CAB", "e": "C giới thiệu người, A mô tả tính cách, B “但是” chuyển ngược."}, {"p": ["后来我发现，真诚地道歉其实一点也不丢脸", "以前我不愿意向别人说“对不起”", "因为我觉得那样会让自己很没面子"], "k": "BCA", "e": "B “以前” trước, C “因为” giải thích, A “后来” sau cùng."}, {"p": ["所以他们之间很少吵架", "他们俩性格正好相反，一个爱说，一个爱听", "我的两个朋友相处得特别好"], "k": "CBA", "e": "C nêu hiện tượng, B nêu lý do, A “所以” nêu kết quả."}], "R3": [{"txt": "人在看到别人笑的时候，自己也容易笑起来，这叫“情绪传染”。所以，如果你每天都跟总是抱怨的人在一起，你的心情也会变得很差。想要快乐，就要多和积极的人在一起。", "q": "这段话告诉我们什么？", "o": ["多笑对身体好", "要少跟别人聊天", "应该多和积极的人在一起", "抱怨可以解决问题"], "k": 2, "e": "Câu cuối: muốn vui thì nên ở cùng người tích cực."}, {"txt": "小张刚到公司的时候，总是不敢在会上发表意见。后来经理对他说：“说错了没关系，不说才是问题。”听了这句话，小张慢慢开始大胆表达自己的想法，现在他已经是部门里最爱发言的人了。", "q": "经理的话对小张有什么影响？", "o": ["他开始大胆表达想法", "他变得不敢说话", "他离开了公司", "他当上了经理"], "k": 0, "e": "Sau câu nói đó Tiểu Trương dần dám nói ra suy nghĩ."}, {"txt": "有人说，选择比努力更重要，也有人说，努力比选择更重要。其实这两种说法都有道理：方向错了，再努力也到不了目的地；可是只选对方向不努力，也走不到终点。", "q": "关于选择和努力，作者的看法是什么？", "o": ["选择最重要", "努力没有用", "方向可以不考虑", "两者都很重要"], "k": 3, "e": "Tác giả cho rằng cả hai cách nói đều có lý."}, {"txt": "很多人以为，原谅别人是对别人好。其实，原谅更多是对自己好。因为一直生气的人，心里会很累，只有放下了，自己才能轻松起来。", "q": "作者认为原谅对谁更有好处？", "o": ["对别人", "对自己", "对朋友", "对家人"], "k": 1, "e": "Bài viết nói tha thứ chủ yếu tốt cho chính mình."}, {"txt": "我的邻居张奶奶今年八十岁了，每天都早起锻炼，还在学习用手机。她说：“人老了，心不能老。只要愿意学习，每一天都是新的开始。”", "q": "张奶奶是个什么样的人？", "o": ["对生活很积极", "身体不好", "不喜欢手机", "不愿意学习"], "k": 0, "e": "Bà dậy sớm tập thể dục, học dùng điện thoại, tinh thần tích cực."}, {"txt": "心理学家发现，当人们为别人花钱的时候，比为自己花钱时更快乐。所以，下次你想让自己开心，不如请朋友吃一顿饭，或者给家人买一份小礼物。", "q": "为别人花钱会怎么样？", "o": ["更容易生气", "变得更穷", "压力变大", "感到更快乐"], "k": 3, "e": "Nghiên cứu nói tiêu tiền cho người khác thì vui hơn."}, {"txt": "每个人都有自己的“舒服区”，在那里做事很轻松，也不会犯错。但是，如果总是待在里面，就很难进步。偶尔离开舒服区，试试新的事情，你会发现自己比想象的更有能力。", "q": "为什么要离开“舒服区”？", "o": ["因为那里不安全", "为了进步和发现自己的能力", "因为想要休息", "因为别人要求"], "k": 1, "e": "Cứ ở mãi thì khó tiến bộ, rời đi sẽ thấy mình có năng lực hơn."}, {"txt": "小时候，妈妈常对我说：“别人的话只是意见，不是事实。”那时候我听不懂。长大以后，每次被人批评，我就会想起这句话，然后冷静地想想对方说得有没有道理，再决定要不要改变。", "q": "“我”被批评以后会怎么做？", "o": ["马上生气", "马上改变", "冷静地想想有没有道理", "不再理那个人"], "k": 2, "e": "Anh ấy bình tĩnh nghĩ xem đối phương có lý không rồi mới quyết định."}, {"txt": "有些人遇到问题，第一反应是“这不是我的错”。可是，找借口不能解决问题。真正成熟的人，会先问自己：我可以做些什么？", "q": "成熟的人遇到问题会怎么做？", "o": ["想想自己能做什么", "马上找借口", "说是别人的错", "等别人来帮忙"], "k": 0, "e": "Người trưởng thành tự hỏi mình có thể làm gì."}, {"txt": "住在同一栋楼里的人，常常十年都不知道邻居的名字。最近，我们小区组织了“邻居节”，大家带着自己做的菜在院子里一起吃饭。吃完饭，很多人互相留了电话。", "q": "邻居节之后发生了什么？", "o": ["大家吵架了", "很多人互相留了电话", "小区的人搬走了", "邻居们成了同事"], "k": 1, "e": "Sau bữa ăn nhiều người để lại số điện thoại cho nhau."}], "W1": [{"w": ["非常", "他的", "开朗", "性格"], "a": ["他的性格非常开朗。"]}, {"w": ["接受", "我们", "缺点", "自己的", "应该", "学会"], "a": ["我们应该学会接受自己的缺点。"]}, {"w": ["所有的", "把", "朋友", "他", "这件事", "告诉了"], "a": ["他把这件事告诉了所有的朋友。"]}, {"w": ["被", "他", "解决了", "这个问题"], "a": ["这个问题被他解决了。"]}, {"w": ["不", "你", "相信", "为什么", "他说的话"], "a": ["你为什么不相信他说的话？"]}], "W2": [{"w": "后悔", "hint": "Một người đàn ông nhìn bài thi điểm thấp, vẻ mặt hối hận.", "a": "他看着考试成绩，后悔没有认真复习。"}, {"w": "关心", "hint": "Một cô gái hỏi han người bạn đang bị ốm.", "a": "她很关心生病的朋友，每天都去看他。"}, {"w": "安静", "hint": "Một bé gái ngồi đọc sách trong căn phòng yên tĩnh.", "a": "女孩儿坐在安静的房间里看书。"}]}, {"id": 10, "title": "Đề 10", "topics": "Tổng hợp: nhà ở, thành phố, thư viện, bệnh viện, ngân hàng, thời trang", "L1": [{"a": "我们小区旁边新开了一家图书馆，周末孩子们都喜欢去那儿看书，所以位子经常坐满。", "s": "周末图书馆里人很多。", "t": true, "e": "Cuối tuần trẻ em đều đến đọc sách nên chỗ ngồi thường kín."}, {"a": "这条裤子颜色很好看，可是有点儿长。我想让商店帮我改短一点儿，大概明天可以取。", "s": "他打算买一条新裤子。", "t": false, "e": "Anh ấy định nhờ cửa hàng sửa ngắn chiếc quần này, không mua quần mới."}, {"a": "王先生去银行办信用卡，工作人员说需要带身份证和工作证明，他今天忘了带工作证明，只好明天再去。", "s": "王先生今天没办成信用卡。", "t": true, "e": "Ông quên giấy chứng nhận công tác nên phải đi lại vào ngày mai."}, {"a": "医生说我的感冒不严重，不用打针，多喝水，多休息，三天以后就会好的。", "s": "医生让他打针。", "t": false, "e": "Bác sĩ nói không cần tiêm."}, {"a": "这个城市的地铁很方便，坐地铁上班不会堵车，所以很多人都不开车了。", "s": "坐地铁会堵车。", "t": false, "e": "Đoạn nghe nói đi tàu điện ngầm thì không bị tắc đường."}], "L2": [{"d": [["女", "这套房子离地铁站近吗？"], ["男", "走路大概五分钟，而且旁边还有超市。"]], "q": "这套房子怎么样？", "o": ["离地铁站很远", "房租很便宜", "面积很大", "交通很方便"], "k": 3, "e": "Đi bộ khoảng 5 phút tới tàu điện ngầm, lại có siêu thị bên cạnh."}, {"d": [["男", "您好，我想把这些钱存进银行卡里。"], ["女", "好的，请把身份证给我。"]], "q": "男的在做什么？", "o": ["在银行办事", "在医院挂号", "在商店买衣服", "在图书馆借书"], "k": 0, "e": "Anh ấy muốn gửi tiền vào thẻ ngân hàng."}, {"d": [["女", "这本书能借几天？"], ["男", "可以借一个月，到期前还能再借一次。"]], "q": "他们最可能在哪儿？", "o": ["书店", "图书馆", "学校", "邮局"], "k": 1, "e": "Mượn sách một tháng, có thể gia hạn, nên là thư viện."}, {"d": [["男", "医生，我这几天总是头疼，晚上也睡不着。"], ["女", "你最近是不是工作压力太大？先去做个检查吧。"]], "q": "女的让男的做什么？", "o": ["马上出院", "少吃点儿饭", "去做检查", "多运动"], "k": 2, "e": "Bác sĩ bảo anh đi làm kiểm tra trước."}, {"d": [["女", "这件衬衫穿在我身上是不是有点儿小？"], ["男", "有一点儿，我帮你拿大一号的吧。"]], "q": "男的要做什么？", "o": ["拿大一号的衣服", "换个颜色", "便宜一点儿", "拿小一号的"], "k": 0, "e": "Anh ấy nói sẽ lấy cho cô cỡ lớn hơn một số."}, {"d": [["男", "听说你们搬到新家了，住得习惯吗？"], ["女", "房子比以前大了，就是离公司远了，每天要早起一个小时。"]], "q": "女的觉得新家有什么问题？", "o": ["房子太小", "邻居太吵", "房租太贵", "离公司太远"], "k": 3, "e": "Cô nói nhà xa công ty nên mỗi ngày phải dậy sớm một tiếng."}, {"d": [["女", "我的银行卡找不到了，怎么办？"], ["男", "别着急，先打电话给银行，让他们暂时停用。"]], "q": "男的建议女的怎么做？", "o": ["马上去买新手机", "先通知银行", "去找警察", "等一等"], "k": 1, "e": "Anh bảo gọi điện cho ngân hàng để tạm khóa thẻ."}, {"d": [["男", "这个城市的夏天太热了，我有点儿不习惯。"], ["女", "是啊，不过秋天特别舒服，你再等一个月。"]], "q": "女的是什么意思？", "o": ["夏天不太热", "想去别的城市", "过一阵天气会变舒服", "现在已经是秋天了"], "k": 2, "e": "Cô nói mùa thu rất dễ chịu, đợi thêm một tháng nữa."}], "L3": [{"d": [["女", "我看中了城东的一套两居室，你觉得怎么样？"], ["男", "价格是多少？"], ["女", "一个月三千五，包括物业费。"], ["男", "有点儿贵，不过如果环境好，也值得。"]], "q": "关于那套房子，下面哪个正确？", "o": ["租金包括物业费", "有三个房间", "在城西", "价格很便宜"], "k": 0, "e": "Cô nói 3500 một tháng, đã bao gồm phí quản lý."}, {"d": [["男", "我想办一张图书馆的借书卡。"], ["女", "请先填这张表，再交五十块钱押金。"], ["男", "押金以后还能退吗？"], ["女", "不再用的时候，把卡还回来就能退。"]], "q": "男的办卡要交什么？", "o": ["身份证", "照片", "年费", "押金"], "k": 3, "e": "Nhân viên bảo nộp 50 tệ tiền đặt cọc."}, {"d": [["女", "您好，请问您哪儿不舒服？"], ["男", "我昨天开始发烧，嗓子也很疼。"], ["女", "量一下体温吧，三十八度五，得吃点儿药了。"], ["男", "需要住院吗？"], ["女", "不用，回家按时吃药，多喝水，两天后再来检查。"]], "q": "医生让男的怎么做？", "o": ["住院治疗", "回家吃药休息", "马上做手术", "去别的医院"], "k": 1, "e": "Bác sĩ bảo về nhà uống thuốc đúng giờ, nghỉ ngơi."}, {"d": [["男", "这件大衣打完折还要八百块，太贵了。"], ["女", "可是质量很好，而且可以穿很多年。"], ["男", "我再看看别的吧。"], ["女", "那你可以先试一下，穿着舒服再决定。"]], "q": "女的觉得这件大衣怎么样？", "o": ["样子很旧", "打折以后很便宜", "质量好，能穿很多年", "颜色不好看"], "k": 2, "e": "Cô nói chất lượng tốt và mặc được nhiều năm."}], "L3p": [{"txt": "现在很多大城市都在建“一刻钟生活圈”，也就是在走路十五分钟的范围内，居民可以找到超市、医院、公园和学校。这样，人们不用开车就能解决日常生活中的问题，既节约了时间，也减少了堵车和空气污染。", "qs": [{"q": "“一刻钟生活圈”是什么意思？", "o": ["开车十五分钟能到的地方", "走路十五分钟内能找到日常设施", "十五分钟内能到市中心", "一刻钟就能搬完家"], "k": 1, "e": "Trong phạm vi đi bộ 15 phút có siêu thị, bệnh viện, công viên, trường học."}, {"q": "这样做有什么好处？", "o": ["房子会变便宜", "工作更容易找", "孩子不用上学", "减少堵车和污染"], "k": 3, "e": "Văn bản nói giảm tắc đường và ô nhiễm không khí."}]}, {"txt": "最近银行的工作人员提醒大家，不要把自己的密码告诉别人，也不要随便点开陌生人发来的链接。有位老人收到一条短信，说他的银行卡有问题，让他马上点开链接。老人觉得不对，先打电话问了银行，才发现那是骗人的，没有受到损失。", "qs": [{"q": "银行提醒大家什么？", "o": ["多存一点钱", "常换银行卡", "不要告诉别人密码", "不要去银行办事"], "k": 2, "e": "Ngân hàng nhắc đừng nói mật khẩu cho người khác."}, {"q": "老人为什么没有受骗？", "o": ["先打电话问了银行", "点开了链接", "把密码告诉了儿子", "没有收到短信"], "k": 0, "e": "Ông thấy không đúng nên gọi điện hỏi ngân hàng trước."}]}, {"txt": "我有个习惯：每个季节结束的时候，把不穿的衣服整理出来。以前我会把它们扔掉，后来朋友告诉我，旧衣服可以送给需要的人，或者放到小区的回收箱里。现在我的衣柜变整齐了，我也觉得这样做很有意义。", "qs": [{"q": "“我”以前怎么处理不穿的衣服？", "o": ["扔掉", "送给朋友", "卖给商店", "放进回收箱"], "k": 0, "e": "Trước đây tôi vứt đi."}, {"q": "现在“我”觉得怎么样？", "o": ["衣服不够穿", "觉得很麻烦", "衣柜整齐，也有意义", "朋友不高兴"], "k": 2, "e": "Tủ quần áo gọn gàng và thấy có ý nghĩa."}]}], "R1": {"words": ["办理", "整理", "温度", "选择", "距离", "免费"], "items": [{"s": "我想（　）一张新的银行卡，需要带什么材料？", "k": 0, "e": "“办理银行卡” là cách nói quen thuộc khi làm thẻ."}, {"s": "周末我要把书架（　）一下，把旧书都放好。", "k": 1, "e": "Sắp xếp giá sách dùng “整理”."}, {"s": "冬天室内的（　）最好保持在二十度左右。", "k": 2, "e": "“二十度” là nhiệt độ, dùng “温度”."}, {"s": "面对两套价格差不多的房子，他不知道该（　）哪一套。", "k": 3, "e": "“选择 + 哪一套” chọn một trong hai."}, {"s": "新家到公司的（　）只有两公里，骑车很方便。", "k": 4, "e": "“两公里” là khoảng cách (距离)."}]}, "R2": [{"p": ["他先去窗口挂了号", "再到二楼找医生检查", "小刘一早就来到医院"], "k": "CAB", "e": "C nêu sự việc, A “先”, B “再”."}, {"p": ["可是房租比去年涨了不少", "这套房子的位置非常好", "所以我还在考虑要不要继续住"], "k": "BAC", "e": "B ưu điểm, A “可是” chuyển ý, C “所以” kết luận."}, {"p": ["周末我陪妈妈去逛街", "她想买一条灰色的裙子", "可是逛了三家商店都没有找到"], "k": "ABC", "e": "A mở đầu, B nêu mong muốn, C “可是” kết quả trái ngược."}, {"p": ["这样就安全多了", "如果你不放心把钱放在手机里", "可以先把它存进银行卡"], "k": "BCA", "e": "B “如果” nêu điều kiện, C đề xuất, A “这样” là kết quả."}, {"p": ["这个城市的春天特别短", "所以想看花的话，一定要抓紧时间", "一般只有一个月左右，花就谢了"], "k": "ACB", "e": "A nêu chủ đề, C giải thích, B “所以” kết luận."}], "R3": [{"txt": "这家咖啡馆开在一座老图书馆的二楼。客人可以一边喝咖啡，一边翻看旁边书架上的书。因为环境安静，很多学生都爱来这里写作业。", "q": "这家咖啡馆有什么特点？", "o": ["在书店的一楼", "价格很便宜", "可以一边喝咖啡一边看书", "晚上不开门"], "k": 2, "e": "Khách vừa uống cà phê vừa xem sách trên giá bên cạnh."}, {"txt": "住在高层的人常常觉得，坐电梯很方便，可是遇到停电就麻烦了。有一次我们楼停电，我提着东西爬了十八层，到家的时候累得说 , "多了"], "a": ["这条裙子比那条漂亮多了。"]}, {"w": ["我", "图书馆里的", "还", "书", "没看完"], "a": ["图书馆里的书我还没看完。", "我还没看完图书馆里的书。"]}, {"w": ["医生", "让他", "多", "休息", "一下"], "a": ["医生让他多休息一下。"]}], "W2": [{"w": "整理", "hint": "Một người phụ nữ đang sắp xếp quần áo trong tủ.", "a": "她正在整理衣柜里的衣服。"}, {"w": "排队", "hint": "Nhiều người xếp hàng chờ ở quầy ngân hàng.", "a": "很多人在银行里排队等着办事。"}, {"w": "检查", "hint": "Bác sĩ đang khám cho một cậu bé.", "a": "医生正在给小男孩检查身体。"}]}];let XRUN=0;
