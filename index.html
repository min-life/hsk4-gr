 const sp=el('div','row');const ra=el('label','mut','Tốc độ đọc ');const rg=el('input');rg.type='range';rg.min='.5';rg.max='1.1';rg.step='.05';rg.value=RATE;rg.oninput=()=>{RATE=+rg.value};ra.append(rg);const all=el('button','btn sm','🔊 Nghe tất cả ví dụ');all.onclick=()=>sayAll(l.ex.map(e=>e.z));sp.append(ra,all);root.append(sp);
 l.ex.forEach(e=>{const b=el('button','ex',`<div class="z zh">${esc(e.z)}</div><div class="p">${e.p}</div><div class="v">${e.v}</div>`);b.onclick=()=>say(e.z);root.append(b)});
 if(l.note)root.append(el('div','ok',`<b>${l.note[0]}.</b> ${l.note[1]}`));
 (l.tables||[]).forEach((t,ti)=>{const d=el('details');if(ti===0)d.open=true;d.append(el('summary','',t.title+(t.kick?` <span class="mut" style="font-weight:400;font-size:13px">· ${t.kick}</span>`:'')));
  t.rows.forEach(r=>{const b=el('button','ex',`<div class="z zh" style="font-size:18px">${esc(r[0])}</div><div class="mut" style="font-size:14px">${r[1]}</div><div class="zh" style="font-size:17px;margin-top:4px">${esc(r[2])}</div><div class="p">${r[4]}</div><div class="v">${r[3]}</div>`);b.onclick=()=>say(r[2]);d.append(b)});root.append(d)});
 const nv=el('div','row');const bd=el('button','btn pri',done[l.id]?'✓ Đã ôn (bấm để bỏ)':'Đánh dấu đã ôn');bd.onclick=()=>{if(done[l.id])delete done[l.id];else done[l.id]=new Date().toISOString().slice(0,10);store.s('done',done);bd.textContent=done[l.id]?'✓ Đã ôn (bấm để bỏ)':'Đánh dấu đã ôn'};
 const bp=el('button','btn','← Bài trước');bp.onclick=()=>nav('L'+D.lessons[(idx+D.lessons.length-1)%D.lessons.length].id);const bn=el('button','btn','Bài sau →');bn.onclick=()=>nav('L'+D.lessons[(idx+1)%D.lessons.length].id);
 const bdr=el('button','btn','Làm bài tập');bdr.onclick=()=>nav('D'+l.id);if(!l.drills.length)bdr.disabled=true;
 nv.append(bd,bdr,bp,bn);root.append(nv)};
/* exercise renderers */
const strip=s=>s.replace(/[，。？！、,.?!\s]/g,'');
function mcBox(c,q,opts,ans,expl,cb){let fin=false;opts.forEach(o=>{const b=el('button','opt zh',esc(o));b.onclick=()=>{if(fin)return;fin=true;const ok=o===ans;b.classList.add(ok?'right':'wrong');if(!ok)$$('.opt',c).forEach(x=>{if(x.textContent===ans)x.classList.add('right')});if(expl)c.append(el('div',ok?'ok':'bad',(ok?'Đúng. ':'Chưa đúng. ')+expl));cb&&cb(ok)};c.append(b)})}
function fillEx(root,d){const pool=d.opts&&d.opts.length?d.opts:(d.bank&&d.bank.length?d.bank:[...new Set(d.items.map(i=>i[1].split('|')[0]))]);
 if(d.bank&&d.bank.length)root.append(el('p','zh','Chọn từ: <b>'+d.bank.join('　')+'</b>'));
 d.items.forEach((it,k)=>{const c=el('div','card');c.style.margin='10px 0';const a=it[1].split('|')[0];c.append(el('div','zh',`<b>${k+1}.</b> ${esc(it[0])}`));
  let opts=shuf([a,...shuf(pool.filter(x=>x!==a)).slice(0,3)]);mcBox(c,it[0],opts,a,'Đáp án: '+it[1].replace('|',' / '),ok=>{if(ok)say(it[0].replace(/（\s*）/g,a.replace(/……/g,'，')))});root.append(c)})}
function sortEx(root,d,single){const items=single?[single]:d.items;
 items.forEach((it,k)=>{const w=it[0].split(' / ').map(s=>s.trim());const full=it[1];const c=el('div','card');c.style.margin='10px 0';c.append(el('div','mut',`Câu ${k+1}`));
  const slot=el('div','slot zh'),chips=el('div','chips zh'),res=el('div');let pick=[];const sh=shuf(w);
  const render=()=>{slot.innerHTML='';pick.forEach((x,pi)=>{const b=el('button','chip',sh[x]);b.onclick=()=>{pick.splice(pi,1);render()};slot.append(b)});$$('.chip',chips).forEach((b,x)=>b.classList.toggle('used',pick.includes(x)))};
  sh.forEach((t,x)=>{const b=el('button','chip',esc(t));b.onclick=()=>{if(!pick.includes(x)){pick.push(x);render()}};chips.append(b)});
  const row=el('div','row');const chk=el('button','btn pri','Kiểm tra'),hnt=el('button','btn','Xem đáp án'),rs=el('button','btn','Làm lại');
  chk.onclick=()=>{if(!pick.length)return;const v=pick.map(x=>sh[x]).join('');if(strip(v)===strip(full)){res.innerHTML=`<div class="ok zh"><b>${esc(full)}</b></div>`;say(full)}else res.innerHTML='<div class="bad">Chưa đúng, thử lại.</div>'};
  hnt.onclick=()=>{res.innerHTML=`<div class="bad zh">Đáp án: <b>${esc(full)}</b></div>`};rs.onclick=()=>{pick=[];render();res.innerHTML=''};
  row.append(chk,hnt,rs);c.append(slot,chips,row,res);root.append(c);render()})}
function revEx(root,d){d.items.forEach((it,k)=>{const w=el('div');w.style.margin='10px 0';w.append(el('div','zh',`<b>${k+1}.</b> ${esc(it[0])}`));const a=el('div','ans','Bấm để hiện đáp án');a.onclick=()=>{if(a.classList.contains('open'))return;a.classList.add('open');a.innerHTML=`<div class="zh" style="font-size:18px;font-weight:700">${esc(it[1])}</div>`;say(it[1])};w.append(a);root.append(w)})}
VIEW.drill=(root,id)=>{id=id||store.g('lesson','1');let l=byId[id];if(!l)l=D.lessons[0];store.s('lesson',l.id);
 const top=el('div','row');top.append(lessonSel(l.id,v=>nav('D'+v)));root.append(top);
 root.append(el('h3','',`<span class="zh">${l.zh}</span> · ${l.name}`));
 if(!l.drills.length){root.append(el('p','mut','Phần này chỉ có bảng kiến thức, chưa có bài tập riêng. Hãy làm tab Trắc nghiệm hoặc Sắp xếp để ôn các bài khác.'));const b=el('button','btn pri','Mở bài giảng');b.onclick=()=>nav('L'+l.id);root.append(b);return}
 l.drills.forEach(d=>{root.append(el('h3','',d.title));if(d.t==='fill'||d.t==='mc')fillEx(root,d);else if(d.t==='sort')sortEx(root,d);else revEx(root,d)})};
/* sort practice */
VIEW.sort=root=>{const pool=[];D.lessons.forEach(l=>l.drills.forEach(d=>{if(d.t==='sort')d.items.forEach(it=>pool.push({l,it}))}));let q=shuf(pool),i=0;const box=el('div');
 const draw=()=>{box.innerHTML='';if(i>=q.length){q=shuf(pool);i=0}const x=q[i];box.append(el('p','hint',`Câu ${i+1}/${q.length} · ${tag(x.l)} ${x.l.name}`));sortEx(box,null,x.it);const n=el('button','btn pri','Câu tiếp');n.onclick=()=>{i++;draw()};box.append(n)};
 root.append(el('p','hint','Sắp xếp các từ thành câu đúng. Câu lấy ngẫu nhiên từ các bài đã học.'),box);draw()};
/* quiz */
VIEW.quiz=(root)=>{let scope=store.g('qscope','all');const box=el('div');
 const mkQ=()=>{const out=[];D.quiz.forEach(x=>{if(scope==='all'||x.l===scope)out.push({q:x.q,o:x.o,a:x.o[x.a],e:x.e,l:x.l})});
  const pool=[];D.lessons.forEach(l=>{if(scope!=='all'&&l.id!==scope)return;l.drills.forEach(d=>{if(d.t==='fill'||d.t==='mc'){const opts=d.opts&&d.opts.length?d.opts:(d.bank&&d.bank.length?d.bank:[...new Set(d.items.map(i=>i[1].split('|')[0]))]);if(opts.length>1)d.items.forEach(it=>{const a=it[1].split('|')[0];pool.push({q:it[0],o:shuf([a,...shuf(opts.filter(x=>x!==a)).slice(0,3)]),a,e:'Đáp án: '+it[1].replace('|',' / '),l:l.id})})}})});
  return shuf([...out,...shuf(pool).slice(0,Math.max(0,12-out.length))])};
 let Q=mkQ(),i=0,sc=0;
 const top=el('div','row');const sel=lessonSel(scope,v=>{scope=v;store.s('qscope',v);root.innerHTML='';VIEW.quiz(root)});const o=document.createElement('option');o.value='all';o.textContent='Tất cả các bài';sel.prepend(o);sel.value=scope;top.append(sel);
 const draw=()=>{box.innerHTML='';if(i>=Q.length){box.append(el('div','card',`<h3 style="margin:0">Điểm: ${sc}/${Q.length}</h3>`));const b=el('button','btn pri','Làm lại');b.style.marginTop='10px';b.onclick=()=>{root.innerHTML='';VIEW.quiz(root)};box.append(b);return}
  const x=Q[i];const c=el('div','card',`<div class="mut">Câu ${i+1}/${Q.length} · đúng ${sc}${x.l?' · bài '+x.l:''}</div><div class="prog"><i style="width:${100*i/Q.length}%"></i></div><div class="zh" style="font-size:19px;font-weight:700;margin:6px 0">${esc(x.q)}</div>`);
  mcBox(c,x.q,x.o,x.a,x.e,ok=>{if(ok)sc++;const n=el('button','btn pri','Câu tiếp');n.style.marginTop='10px';n.onclick=()=>{i++;draw()};c.append(n)});box.append(c)};
 root.append(top,box);if(!Q.length){box.append(el('p','mut','Bài này chưa có câu trắc nghiệm. Hãy chọn bài khác.'));return}draw()};
/* listen */
VIEW.listen=root=>{let scope=store.g('lscope','all');const top=el('div','row');const sel=lessonSel(scope,v=>{scope=v;store.s('lscope',v);root.innerHTML='';VIEW.listen(root)});const o=document.createElement('option');o.value='all';o.textContent='Tất cả các bài';sel.prepend(o);sel.value=scope;top.append(sel);
 const list=[];D.lessons.forEach(l=>{if(scope!=='all'&&l.id!==scope)return;l.ex.forEach(e=>list.push({l,z:e.z,p:e.p,v:e.v}));(l.tables||[]).forEach(t=>t.rows.forEach(r=>list.push({l,z:r[2],p:r[4],v:r[3]})))});
 const bar=el('div','row');const pl=el('button','btn pri','▶ Nghe lần lượt');const st=el('button','btn','■ Dừng');const rl=el('label','mut','Tốc độ ');const rg=el('input');rg.type='range';rg.min='.5';rg.max='1.1';rg.step='.05';rg.value=RATE;rg.oninput=()=>{RATE=+rg.value};rl.append(rg);
 const box=el('div','lines');let nodes=[];
 const tg=(t,cls)=>{const b=el('button','btn sm',t);b.setAttribute('aria-pressed','true');b.onclick=()=>{const on=b.getAttribute('aria-pressed')==='true';b.setAttribute('aria-pressed',on?'false':'true');b.style.opacity=on?.5:1;box.classList.toggle(cls,on)};bar.append(b)};
 pl.onclick=()=>sayAll(list,x=>{nodes.forEach(n=>n.style.background='');const n=nodes[list.indexOf(x)];if(n){n.style.background='var(--card2)';n.scrollIntoView({block:'center',behavior:'smooth'})}});st.onclick=()=>{token++;speechSynthesis.cancel()};
 bar.append(pl,st,rl);tg('Pinyin','hide-py');tg('Tiếng Việt','hide-vi');
 list.slice(0,300).forEach(x=>{const r=el('div','l',`<span class="who">${tag(x.l)}</span><button class="btn sm" style="float:right">🔊</button><div class="zh" style="font-size:18px">${esc(x.z)}</div><div class="pyl">${x.p}</div><div class="vil">${x.v}</div>`);$('button',r).onclick=()=>say(x.z);box.append(r);nodes.push(r)});
 root.append(top,el('p','hint',`${list.length} câu ví dụ`),bar,box)};
/* search */
VIEW.search=root=>{const inp=el('input');inp.type='text';inp.placeholder='Gõ chữ Hán, pinyin hoặc từ tiếng Việt (ví dụ: 即使, bất kể, bổ ngữ)';inp.autocapitalize='off';const out=el('div');
 const norm=s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d');
 const run=()=>{const q=inp.value.trim();out.innerHTML='';if(!q)return;const nq=norm(q);let n=0;
  D.lessons.forEach(l=>{const hits=[];const test=s=>s&&(s.includes(q)||norm(s).includes(nq));if(test(l.name)||test(l.zh)||test(l.mean)||test(l.formula))hits.push(['Điểm ngữ pháp',l.name+' · '+l.formula]);
   l.ex.forEach(e=>{if(test(e.z)||test(e.p)||test(e.v))hits.push(['Ví dụ',e.z,e.v])});(l.tables||[]).forEach(t=>t.rows.forEach(r=>{if(test(r[0])||test(r[1])||test(r[2])||test(r[3])||test(r[4]))hits.push([r[0],r[2],r[1]])}));
   if(hits.length){n++;const d=el('details');d.open=n<=3;d.append(el('summary','',`${tag(l)} · <span class="zh">${l.zh}</span> <span class="mut" style="font-weight:400">${hits.length} kết quả</span>`));hits.slice(0,12).forEach(h=>{const b=el('button','ex',`<div class="mut" style="font-size:12px">${esc(h[0])}</div><div class="zh" style="font-weight:700">${esc(h[1])}</div>${h[2]?'<div class="v">'+esc(h[2])+'</div>':''}`);b.onclick=()=>say(h[1]);d.append(b)});const go1=el('button','btn sm','Mở bài giảng');go1.onclick=()=>nav('L'+l.id);d.append(go1);out.append(d)}});
  if(!n)out.append(el('p','mut','Không tìm thấy.'))};
 inp.oninput=run;root.append(inp,out)};
/* progress */
VIEW.progress=root=>{const n=Object.keys(done).length;root.append(el('div','card',`<h3 style="margin:0">Đã ôn ${n}/${D.lessons.length} phần</h3><div class="prog"><i style="width:${100*n/D.lessons.length}%"></i></div><p class="mut">Đánh dấu “đã ôn” ở tab Bài giảng. Tiến độ lưu trên máy này.</p>`));
 const days=new Set(Object.values(done));let streak=0;const d=new Date();for(;;){const k=d.toISOString().slice(0,10);if(days.has(k)){streak++;d.setDate(d.getDate()-1)}else if(streak===0&&k===new Date().toISOString().slice(0,10)){d.setDate(d.getDate()-1)}else break}
 root.append(el('p','',`Chuỗi ngày ôn liên tiếp: <b>${streak}</b>`));
 const g=el('div');D.lessons.forEach(l=>{const b=el('button','ex',`<span class="zh" style="font-weight:700">${tag(l)} · ${l.zh}</span> <span class="mut">${l.name}</span> ${done[l.id]?'<span class="ok" style="padding:1px 8px;margin-left:6px">✓ '+done[l.id]+'</span>':''}`);b.onclick=()=>nav('L'+l.id);g.append(b)});root.append(g);
 const r=el('button','btn sm','Xóa tiến độ');r.onclick=()=>{for(const k in done)delete done[k];store.s('done',done);root.innerHTML='';VIEW.progress(root)};root.append(r)};
route();
</script>
